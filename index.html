rst step of teshuva: admitting what you did.", "Hashem insegnò che chi ha fatto un torto deve confessarlo e restituire ciò che ha preso.", "Hashem taught that someone who wronged another must confess and return what they took."], ["כֹּה", "Così benedirete i figli d'Israele", "This is how you shall bless the Children of Israel", "Istruzioni ai sacerdoti su come benedire il popolo.", "Instructions to the priests on how to bless the people.", "Hashem disse a Mosè di insegnare ad Aronne e ai suoi figli le parole con cui benedire Israele.", "Hashem told Moses to teach Aaron and his sons the words for blessing Israel."], ["יְבָרֶכְךָ", "Hashem ti benedica e ti protegga", "May Hashem bless you and protect you", "Una benedizione che si sente in sinagoga, con le mani alzate.", "A blessing heard in synagogue, with raised hands.", "I sacerdoti benedicono il popolo con la Birkat Kohanim. Ancora oggi i Kohanim alzano le mani e benedicono in sinagoga.", "The priests bless the people with the Priestly Blessing. To this day Kohanim raise their hands and bless in synagogue."], ["לְכָה", "Vieni con noi e ti faremo del bene", "Come with us and we will do you good", "Un capo invita il suocero a unirsi al viaggio verso la Terra.", "A leader invites his father-in-law to join the journey to the Land.", "Mosè invitò Hovav (Ietro) a proseguire con loro verso la Terra, promettendogli del bene.", "Moses invited Hobab (Jethro) to continue with them to the Land, promising to treat him well."], ["קוּמָה", "Sorgi, Hashem, e siano dispersi i tuoi nemici", "Arise, Hashem, and let Your enemies be scattered", "Lo si dice in sinagoga quando si tira fuori il Sefer Torah.", "We say this in synagogue when the Torah scroll is taken out.", "Ogni volta che l'Arca partiva, Mosè diceva queste parole. Oggi le diciamo quando si estrae il Sefer Torah.", "Each time the Ark set out, Moses said these words. Today we say them when the Torah scroll is taken out."], ["הַמְקַנֵּא", "Sei forse geloso per me?", "Are you jealous for my sake?", "Un allievo fedele vuole difendere l'onore del suo maestro.", "A loyal student wants to protect his teacher's honor.", "Due uomini cominciarono a profetizzare nel campo. Giosuè voleva fermarli, ma Mosè disse: magari tutto il popolo fosse di profeti!", "Two men began prophesying in the camp. Joshua wanted them stopped, but Moses said he wished all the people were prophets."], ["אֵל", "O Dio, ti prego, guariscila!", "Please, God, heal her now!", "La preghiera più corta della Torah: solo cinque parole.", "The shortest prayer in the Torah: just five words.", "Miriam fu colpita dalla tzaraat dopo aver parlato di Mosè. Mosè pregò subito per lei con una preghiera brevissima.", "Miriam was struck with tzaraat after speaking about Moses. Moses immediately prayed for her with a very short prayer."], ["בָּאנוּ", "Siamo andati nella terra dove ci hai mandati: vi scorre davvero latte e miele", "We came to the land you sent us to, and it truly flows with milk and honey", "Degli inviati tornano dopo quaranta giorni con un enorme grappolo d'uva.", "Messengers return after forty days with a huge cluster of grapes.", "Dodici esploratori tornarono dalla Terra. Dissero che era buona, ma la maggior parte spaventò il popolo.", "Twelve spies came back from the Land. They said it was good, but most of them frightened the people."], ["עָלֹה", "Saliamo e conquistiamola, perché ce la faremo!", "Let us go up and take it, for we can surely do it!", "Un esploratore coraggioso cerca di tranquillizzare tutti.", "One brave spy tries to calm everyone down.", "Quando gli esploratori spaventarono il popolo, Caleb li zittì e disse con fiducia che avrebbero conquistato la Terra.", "When the spies frightened the people, Caleb silenced them and said with confidence they would conquer the Land."], ["סָלַחְתִּי", "Ho perdonato come hai chiesto", "I have forgiven, as you asked", "La risposta a una preghiera, dopo il peccato degli esploratori.", "An answer to a prayer, after the sin of the spies.", "Dopo che il popolo pianse e non volle entrare nella Terra, Mosè pregò per loro e Hashem disse di perdonare.", "After the people wept and refused to enter the Land, Moses prayed for them and Hashem said He forgave."], ["וְעָשׂוּ", "Si facciano delle frange agli angoli delle loro vesti", "Let them make fringes on the corners of their garments", "Fili agli angoli dell'abito che ricordano i precetti.", "Threads on a garment's corners that remind us of the commandments.", "Hashem ordinò di fare gli tzitzit agli angoli degli abiti, perché vedendoli ci ricordiamo di tutti i precetti.", "Hashem commanded tzitzit on garment corners, so seeing them we'd remember all the commandments."], ["רַב", "Basta con voi! Tutta la comunità è santa", "Enough of you! For the whole congregation is holy", "Un cugino si lamenta dei capi e raduna gente attorno a sé.", "A cousin complains about the leaders and gathers people around him.", "Korach e i suoi sostenevano che tutto il popolo era santo, quindi Mosè e Aronne non dovevano stare sopra gli altri.", "Korach and his group claimed the whole people was holy, so Moses and Aaron had no right to lead."], ["בֹּקֶר", "Domattina Hashem farà conoscere chi è suo", "In the morning Hashem will show who is His", "Un capo propone di aspettare fino al mattino seguente.", "A leader suggests waiting until tomorrow morning.", "Mosè non rispose con rabbia. Disse che al mattino Hashem avrebbe mostrato chi era suo e chi aveva scelto.", "Moses didn't answer in anger. He said in the morning Hashem would show who belongs to Him and whom He chose."], ["בְּזֹאת", "Da questo saprete che Hashem mi ha mandato", "By this you shall know that Hashem has sent me", "Un attimo prima che la terra si apra.", "Just before the earth opened its mouth.", "Mosè disse che se la terra avesse inghiottito Korach e i suoi, avrebbero saputo che Hashem lo aveva mandato. E così fu.", "Moses said that if the earth swallowed Korach and his group, they'd know Hashem had sent him. And so it happened."], ["וְדִבַּרְתֶּם", "Parlate alla roccia davanti ai loro occhi, ed essa darà la sua acqua", "Speak to the rock before their eyes, and it will give its water", "Non c'è acqua nel deserto e l'istruzione è parlare, non colpire.", "There's no water in the desert, and the instruction is to speak, not strike.", "Dopo la morte di Miriam mancava l'acqua. Hashem disse di parlare alla roccia, ma Mosè la colpì.", "After Miriam died there was no water. Hashem said to speak to the rock, but Moses struck it."], ["שִׁמְעוּ", "Ascoltate, ribelli: faremo uscire acqua da questa roccia?", "Listen, you rebels: shall we bring water out of this rock for you?", "Un capo esasperato sta davanti a una roccia.", "A frustrated leader stands before a rock.", "Il popolo si lamentava per l'acqua. Mosè si arrabbiò e parlò duramente; per ciò che accadde lì non entrò nella Terra.", "The people complained about water. Moses spoke harshly in anger, and because of what happened he didn't enter the Land."], ["נַעְבְּרָה", "Lasciaci passare per il tuo paese: non attraverseremo campi né vigne", "Let us pass through your land; we will not pass through field or vineyard", "Una richiesta cortese di attraversare la terra di parenti.", "A polite request to cross the land of relatives.", "Mosè mandò messaggeri al re di Edom, discendente di Esaù, chiedendo di passare. Il re rifiutò.", "Moses sent messengers to the king of Edom, Esau's descendants, asking to pass through. The king refused."], ["עֲשֵׂה", "Fatti un serpente e mettilo su un'asta", "Make yourself a serpent and set it on a pole", "Un serpente di rame su un palo: chi lo guarda guarisce.", "A copper snake on a pole: whoever looks at it is healed.", "Il popolo si lamentò e dei serpenti lo morsero. Hashem disse a Mosè di fare un serpente su un'asta: chi lo guardava viveva.", "The people complained and snakes bit them. Hashem told Moses to put a snake on a pole, and whoever looked at it lived."], ["לֹא", "Non andare con loro: non maledire il popolo, perché è benedetto", "Do not go with them; do not curse the people, for they are blessed", "Di notte, a chi era stato invitato a maledire.", "At night, to someone invited to curse.", "I messaggeri di Balak arrivarono da Bil'am. Di notte Dio gli disse di non andare e non maledire Israele, perché è benedetto.", "Balak's messengers came to Balaam. At night God told him not to go or curse Israel, for they are blessed."], ["כִּי", "Perché ti sei presa gioco di me!", "Because you have mocked me!", "Una risposta arrabbiata a un animale che ha parlato.", "An angry reply to an animal that spoke.", "L'asina chiese a Bil'am perché la colpisse. Bil'am rispose arrabbiato che si era presa gioco di lui.", "The donkey asked Balaam why he hit her. Balaam angrily answered that she had mocked him."], ["מֶה", "Che cosa mi hai fatto? Ti ho chiamato a maledire i miei nemici e tu li hai benedetti!", "What have you done to me? I brought you to curse my enemies, and you have blessed them!", "Un re deluso: ha ordinato una maledizione e ha ricevuto una benedizione.", "A disappointed king: he ordered a curse and got a blessing.", "Balak portò Bil'am a maledire Israele, ma dalla sua bocca uscirono solo benedizioni. Balak si infuriò.", "Balak brought Balaam to curse Israel, but only blessings came out. Balak was furious."], ["הִנְנִי", "Ecco, io gli do il mio patto di pace", "Behold, I give him My covenant of peace", "Un premio per chi difese l'onore di Hashem e fermò un'epidemia.", "A reward for someone who defended Hashem's honor and stopped a plague.", "Pinchas agì con coraggio e fermò l'epidemia. Hashem disse a Mosè che gli dava il suo patto di pace.", "Pinchas acted bravely and stopped the plague. Hashem told Moses He was giving Pinchas His covenant of peace."], ["לָמָּה", "Perché il nome di nostro padre dovrebbe scomparire dalla sua famiglia?", "Why should our father's name be lost from his family?", "Cinque sorelle coraggiose chiedono una parte della terra.", "Five brave sisters ask for a share in the land.", "Tzelofchad non aveva figli maschi. Le sue figlie chiesero un'eredità nella Terra, e Hashem disse che avevano ragione.", "Zelophehad had no sons. His daughters asked for an inheritance in the Land, and Hashem said they were right."], ["יִפְקֹד", "Hashem, Dio degli spiriti di ogni carne, nomini un uomo a capo della comunità", "Let Hashem, God of the spirits of all flesh, appoint a man over the congregation", "Un capo si preoccupa di chi guiderà il popolo dopo di lui.", "A leader worries about who will lead after him.", "Saputo che non sarebbe entrato nella Terra, Mosè non chiese per sé, ma che Hashem nominasse un buon capo.", "When Moses heard he wouldn't enter the Land, he asked not for himself but for Hashem to appoint a good leader."], ["קַח", "Prendi Giosuè figlio di Nun, uomo in cui c'è lo spirito", "Take Joshua son of Nun, a man in whom is spirit", "La scelta del prossimo capo.", "The choice of the next leader.", "Hashem rispose alla preghiera di Mosè e gli disse di porre le mani su Giosuè, adatto a guidare.", "Hashem answered Moses' prayer and told him to lay his hands on Joshua, who was fit to lead."], ["לֹא", "Non violerà la sua parola: farà tutto ciò che è uscito dalla sua bocca", "He shall not break his word; he shall do all that comes out of his mouth", "Le parole sono una cosa seria: ciò che si promette, si mantiene.", "Words are serious: what you promise, you keep.", "Mosè insegnò ai capi delle tribù che chi fa un voto o una promessa deve mantenerla.", "Moses taught the tribal heads that whoever makes a vow or promise must keep it."], ["אַל", "Non farci attraversare il Giordano", "Do not bring us across the Jordan", "Tribù con molto bestiame vogliono restare al di là del Giordano.", "Tribes with lots of cattle want to stay east of the Jordan.", "Le tribù di Gad e Ruben avevano molto bestiame e chiesero di stabilirsi a est del Giordano.", "The tribes of Gad and Reuben had large herds and asked to settle east of the Jordan."], ["הַאַחֵיכֶם", "I vostri fratelli andranno in guerra e voi resterete qui?", "Shall your brothers go to war while you sit here?", "Una domanda su responsabilità e solidarietà.", "A question about responsibility and standing together.", "Mosè temeva che non aiutassero le altre tribù. Promisero di combattere in prima fila e solo dopo tornare.", "Moses feared they wouldn't help the other tribes. They promised to fight in front and return only afterwards."], ["וְהוֹרַשְׁתֶּם", "Prenderete possesso della terra e vi abiterete, perché io ve l'ho data", "Take possession of the land and dwell in it, for I have given you the land", "Nelle pianure di Moav, vicino al Giordano, poco prima di entrare.", "On the plains of Moab, by the Jordan, just before entering.", "Alla fine dei viaggi nel deserto Hashem disse a Mosè che Israele avrebbe ereditato la Terra e vi avrebbe abitato.", "At the end of the desert journeys, Hashem told Moses that Israel would inherit the Land and live in it."], ["וְהִקְרִיתֶם", "Sceglierete delle città che saranno per voi città di rifugio", "You shall designate cities to be cities of refuge for you", "Città speciali per chi ha causato una morte per sbaglio.", "Special cities for someone who caused a death by accident.", "Hashem ordinò di stabilire città di rifugio dove potesse ripararsi chi aveva ucciso senza volerlo.", "Hashem commanded setting up cities of refuge where someone who killed by accident could take shelter."], ["כֵּן", "La tribù dei figli di Giuseppe parla giustamente", "The tribe of the sons of Joseph speaks rightly", "Il seguito della storia delle cinque sorelle.", "The continuation of the story of the five sisters.", "I capi della tribù di Menashe temevano che l'eredità delle figlie di Tzelofchad passasse ad altra tribù. Mosè diede loro ragione.", "The heads of Manasseh worried the daughters' inheritance would pass to another tribe. Moses said they were right."], ["רַב", "Siete rimasti abbastanza su questo monte", "You have stayed long enough at this mountain", "Dopo un anno all'Horev, è ora di ripartire.", "After a year at Horeb, it's time to move on.", "Mosè ricordò al popolo che all'Horev Hashem disse che erano rimasti abbastanza e che era ora di andare verso la Terra.", "Moses reminded the people that at Horeb Hashem said they had stayed long enough and it was time to go to the Land."], ["אֵיכָה", "Come posso portare da solo il vostro peso, il vostro carico e le vostre liti?", "How can I alone bear your trouble, your burden and your strife?", "Lo si legge con la melodia di Eichà.", "It is read with the tune of Eicha (Lamentations).", "Mosè raccontò che era difficile giudicarli da solo, perciò nominò giudici e capi.", "Moses told the people it was hard to judge them alone, so he appointed judges and officers."], ["לֹא", "Non avrete riguardi personali nel giudizio: ascolterete il piccolo come il grande", "Do not show favor in judgment; hear the small and the great alike", "Istruzioni per chi deve decidere chi ha ragione.", "Instructions for those who must decide who is right.", "Mosè ricordò cosa disse ai giudici: ascoltare tutti allo stesso modo, piccoli e grandi, senza paura di nessuno.", "Moses recalled what he told the judges: hear everyone equally, small and great, and fear no one."], ["לֹא", "Non temeteli, perché è Hashem vostro Dio che combatte per voi", "Do not fear them, for Hashem your God is the One who fights for you", "Incoraggiamento per un allievo che dovrà guidare le battaglie.", "Encouragement for a student about to lead battles.", "Mosè raccontò di aver incoraggiato Giosuè a non temere i re, perché Hashem avrebbe combattuto per loro.", "Moses told how he encouraged Joshua not to fear the kings, for Hashem would fight for them."], ["אֶעְבְּרָה", "Lasciami passare a vedere la terra buona", "Please let me cross over and see the good land", "La preghiera di un capo che ha sognato la Terra per tutta la vita.", "The prayer of a leader who dreamed of the Land all his life.", "Mosè pregò più volte di poter entrare nella Terra. Hashem non accettò, ma gliela mostrò dalla cima del monte.", "Moses prayed again and again to enter the Land. Hashem refused, but showed it to him from the mountaintop."], ["רַב", "Basta così: non parlarmi più di questa cosa", "Enough! Do not speak to Me any more about this", "Una risposta alla preghiera, diversa da quella sperata.", "An answer to a prayer, not the one hoped for.", "Mosè chiese di entrare nella Terra, e Hashem gli disse di smettere di chiederlo.", "Moses asked to enter the Land, and Hashem told him to stop asking."], ["שְׁמַע", "Ascolta, Israele: Hashem è il nostro Dio, Hashem è uno", "Hear, O Israel: Hashem is our God, Hashem is One", "Lo si dice al mattino, alla sera e prima di dormire.", "We say this morning and evening, and before sleep.", "Mosè insegnò al popolo il versetto di fede più importante: Hashem è uno. Lo si dice nello Shemà.", "Moses taught the people the most important verse of faith: Hashem is One. We say it in the Shema."], ["וְאָהַבְתָּ", "Amerai Hashem tuo Dio con tutto il cuore e con tutta l'anima", "Love Hashem your God with all your heart and all your soul", "Il versetto che segue subito lo «Shemà Israel».", "The verse right after “Shema Yisrael”.", "Mosè ordinò di amare Hashem con tutto il cuore e tutta l'anima. Fa parte dello Shemà.", "Moses commanded loving Hashem with all your heart and soul. It is part of the Shema."], ["כִּי", "L'uomo non vive soltanto di pane", "Man does not live by bread alone", "Che cosa insegnò la manna nel deserto?", "What did the manna teach in the desert?", "Mosè spiegò che Hashem li nutrì con la manna per insegnare che l'uomo non vive solo di pane, ma di ogni parola di Hashem.", "Moses explained Hashem fed them manna to teach that people live not by bread alone, but by all Hashem says."], ["וְאָכַלְתָּ", "Mangerai, ti sazierai e benedirai Hashem tuo Dio", "You shall eat, be satisfied, and bless Hashem your God", "Che cosa si fa dopo aver mangiato a sazietà?", "What do you do after eating and being full?", "Mosè ordinò di benedire Hashem dopo il pasto. Da qui deriva la Birkat Hamazon.", "Moses commanded blessing Hashem after eating. This is where Grace after Meals comes from."], ["מָה", "Che cosa chiede da te Hashem tuo Dio?", "What does Hashem your God ask of you?", "Una grande domanda: che cosa vuole davvero Hashem da noi?", "A big question: what does Hashem really want from us?", "Mosè chiese al popolo che cosa Hashem chiedesse loro e rispose: temerlo, seguire le sue vie e amarlo.", "Moses asked the people what Hashem asks of them and answered: to revere Him, walk in His ways and love Him."], ["רְאֵה", "Vedi, oggi pongo davanti a voi benedizione e maledizione", "See, I set before you today a blessing and a curse", "La prima parola della parashà: guardate!", "The first word of the parasha: look!", "Mosè disse che la scelta era loro: se ascolteranno Hashem, benedizione; altrimenti, maledizione.", "Moses said the choice was theirs: listening to Hashem brings blessing, and not listening, a curse."], ["כִּי", "Aprirai la tua mano per lui", "You shall surely open your hand to him", "Che cosa si fa quando si incontra un povero?", "What do you do when you meet someone poor?", "Mosè ordinò di non chiudere la mano davanti al povero, ma di aprirla e dargli ciò che gli manca.", "Moses commanded not to close your hand to a poor person, but to open it and give what they lack."], ["וְשָׂמַחְתָּ", "Gioirai nella tua festa", "You shall rejoice in your festival", "Due parole che significano: alle feste bisogna essere felici!", "Two words that mean: be happy on the holidays!", "Mosè ordinò di gioire nelle feste, con la famiglia ma anche con l'orfano, la vedova e lo straniero.", "Moses commanded rejoicing on festivals, with family and also with the orphan, widow and stranger."], ["צֶדֶק", "La giustizia, la giustizia perseguirai", "Justice, justice shall you pursue", "Una parola ripetuta due volte per sottolineare quanto è importante.", "A word repeated twice to stress how important it is.", "Mosè ordinò di nominare giudici onesti e di perseguire la giustizia, anche con mezzi giusti.", "Moses commanded appointing honest judges and pursuing justice, by just means too."], ["שְׁמַע", "Ascolta, Israele: oggi state per combattere contro i vostri nemici", "Hear, O Israel: today you are going into battle against your enemies", "Prima della battaglia, qualcuno di speciale incoraggia i soldati.", "Before battle, someone special encourages the soldiers.", "Prima di una guerra c'era un sacerdote speciale, unto per la guerra, che incoraggiava i soldati a non temere.", "Before a war, a special priest anointed for battle encouraged the soldiers not to be afraid."], ["כִּי", "Perché l'uomo è come l'albero del campo", "For a person is like a tree of the field", "Anche in guerra non si devono abbattere gli alberi da frutto.", "Even in war you must not cut down fruit trees.", "Mosè ordinò che, anche assediando una città, non si tagliassero gli alberi da frutto. Da qui si impara a non distruggere inutilmente.", "Moses commanded that even when besieging a city, fruit trees not be cut down. From here we learn not to destroy needlessly."], ["שַׁלֵּחַ", "Lascerai andare la madre e prenderai i piccoli", "Send away the mother, and take the young for yourself", "Un precetto su un nido di uccelli lungo la strada.", "A commandment about a bird's nest along the way.", "Mosè ordinò che chi trova un nido mandi via la madre prima di prendere le uova o i piccoli.", "Moses commanded that whoever finds a nest must send away the mother before taking the eggs or chicks."], ["וְעָשִׂיתָ", "Farai un parapetto al tuo tetto", "You shall make a railing for your roof", "Un precetto di sicurezza quando si costruisce una casa nuova.", "A safety commandment when building a new house.", "Mosè ordinò di costruire un parapetto intorno al tetto perché nessuno cada. Da qui si impara a curare la sicurezza.", "Moses commanded building a railing around the roof so no one would fall. From here we learn to take care of safety."], ["זָכוֹר", "Ricorda ciò che ti ha fatto Amalek", "Remember what Amalek did to you", "Si legge nello Shabbat prima di Purim.", "We read this on the Shabbat before Purim.", "Mosè ordinò di ricordare Amalek, che attaccò Israele lungo il cammino quando erano stanchi.", "Moses commanded remembering Amalek, who attacked Israel on the way when they were tired."], ["הִגַּדְתִּי", "Dichiaro oggi a Hashem tuo Dio che sono entrato nella terra", "I declare today to Hashem your God that I have come into the land", "Un contadino arriva al Tempio con un cesto di primizie.", "A farmer arrives at the Temple with a basket of first fruits.", "Chi portava le primizie diceva al sacerdote che ringraziava Hashem per essere arrivato nella Terra e per i suoi frutti.", "The one bringing first fruits told the priest he thanked Hashem for reaching the Land and for its fruit."], ["הַסְכֵּת", "Fa' silenzio e ascolta, Israele: oggi sei diventato un popolo", "Be silent and hear, O Israel: this day you have become a people", "Insieme ai sacerdoti leviti, un capo fa un grande annuncio.", "Together with the Levite priests, a leader makes a big announcement.", "Mosè e i sacerdoti dissero al popolo che in quel giorno era diventato il popolo di Hashem.", "Moses and the priests told the people that on that day they had become Hashem's people."], ["בָּרוּךְ", "Benedetto sarai in città e benedetto sarai nei campi", "Blessed shall you be in the city, and blessed in the field", "Benedizioni per chi segue le vie di Hashem.", "Blessings for those who follow Hashem's ways.", "Mosè elencò le benedizioni che sarebbero arrivate se il popolo avesse ascoltato Hashem, ovunque si trovasse.", "Moses listed the blessings that would come if the people listened to Hashem, wherever they would be."], ["אֲרַמִּי", "Un arameo voleva distruggere mio padre, ed egli scese in Egitto", "An Aramean sought to destroy my father, and he went down to Egypt", "Parole che si dicono anche nella Haggadà di Pesach.", "Words also said in the Passover Haggadah.", "Chi portava le primizie raccontava davanti a Hashem la storia del popolo, dagli antenati all'arrivo nella Terra. La Haggadà commenta queste parole.", "The one bringing first fruits told before Hashem the people's history, from our ancestors to reaching the Land. The Haggadah expounds these words."], ["אַתֶּם", "Voi state oggi tutti davanti a Hashem vostro Dio", "You are standing today, all of you, before Hashem your God", "Tutti in piedi insieme, dai capi a chi attinge l'acqua.", "Everyone standing together, from leaders to water-drawers.", "Nell'ultimo giorno di vita, Mosè radunò tutto il popolo, grandi e piccoli, per stringere il patto con Hashem.", "On the last day of his life, Moses gathered the whole people, great and small, to make the covenant with Hashem."], ["כִּי", "La parola è molto vicina a te, nella tua bocca e nel tuo cuore, per metterla in pratica", "The word is very near to you, in your mouth and in your heart, to do it", "La Torah non è in cielo né al di là del mare.", "The Torah is not in heaven or across the sea.", "Mosè disse che la Torah non è lontana né troppo difficile: è vicinissima, nella bocca e nel cuore.", "Moses said the Torah isn't far or too hard; it is very close, in our mouth and heart."], ["וּבָחַרְתָּ", "Sceglierai la vita", "Choose life", "Due parole sulla scelta più importante.", "Two words about the most important choice.", "Mosè pose davanti al popolo la vita e la morte, la benedizione e la maledizione, e chiese di scegliere la vita.", "Moses set before the people life and death, blessing and curse, and asked them to choose life."], ["בֶּן", "Oggi ho centovent'anni", "I am one hundred and twenty years old today", "Un'età speciale che si augura ai compleanni.", "A special age we wish people on birthdays.", "Mosè annunciò di avere 120 anni, che non avrebbe attraversato il Giordano e che Giosuè li avrebbe guidati.", "Moses announced he was 120, that he wouldn't cross the Jordan, and that Joshua would lead them."], ["חֲזַק", "Sii forte e coraggioso, perché tu entrerai con questo popolo", "Be strong and courageous, for you shall go with this people", "Davanti a tutto Israele, un capo passa l'incarico al suo allievo.", "Before all Israel, a leader passes the role to his student.", "Mosè chiamò Giosuè davanti a tutto il popolo e lo incoraggiò, perché li avrebbe guidati nella Terra.", "Moses called Joshua before all the people and encouraged him, for he would lead them into the Land."], ["וְעַתָּה", "Ora scrivete per voi questo cantico", "Now write for yourselves this song", "Da qui si impara il precetto di scrivere un Sefer Torah.", "From here we learn the commandment to write a Torah scroll.", "Hashem disse a Mosè e Giosuè di scrivere il cantico e insegnarlo. Da qui l'ultimo precetto della Torah: scrivere un Sefer Torah.", "Hashem told Moses and Joshua to write the song and teach it. From here comes the last commandment: to write a Torah scroll."], ["שְׁאַל", "Interroga tuo padre e te lo racconterà, i tuoi anziani e te lo diranno", "Ask your father and he will tell you, your elders and they will say it to you", "Nel cantico, il consiglio di chiedere alle generazioni precedenti.", "In the song, advice to ask earlier generations.", "Nel cantico Haazinu Mosè disse di chiedere ai genitori e agli anziani, per ricordare ciò che Hashem ha fatto.", "In the Haazinu song, Moses told the people to ask their parents and elders, to remember what Hashem did."], ["שִׂימוּ", "Prendete a cuore tutte le parole che oggi vi testimonio", "Set your hearts to all the words which I testify to you today", "Dopo aver finito di recitare tutto il cantico.", "After finishing reciting the whole song.", "Mosè concluse il cantico e chiese al popolo di prendere a cuore ogni parola e insegnarla ai figli.", "Moses finished the song and asked the people to take every word to heart and teach it to their children."], ["עֲלֵה", "Sali su questo monte degli Avarim, il monte Nevo", "Go up this mountain of Abarim, Mount Nebo", "Un monte da cui si vede la Terra da lontano.", "A mountain from which you can see the Land from afar.", "Hashem disse a Mosè di salire sul monte Nevo, di vedere da lì la terra di Canaan, e che lì sarebbe morto.", "Hashem told Moses to climb Mount Nebo, see the land of Canaan from there, and that he would die there."], ["אֵין", "Non c'è nessuno come il Dio di Yeshurun", "There is none like the God of Jeshurun", "Nell'ultima benedizione, un nome speciale per il popolo d'Israele.", "In the last blessing, a special name for the people of Israel.", "Alla fine delle benedizioni alle tribù, Mosè disse che non c'è nessuno come il Dio di Yeshurun, nome affettuoso di Israele.", "At the end of his blessings to the tribes, Moses said there is none like the God of Jeshurun, a loving name for Israel."], ["אַשְׁרֶיךָ", "Beato te, Israele! Chi è come te, popolo salvato da Hashem?", "Happy are you, Israel! Who is like you, a people saved by Hashem?", "Le ultime parole del grande capo al popolo.", "The great leader's last words to the people.", "Sono le ultime parole di Mosè prima di morire: quanto è felice Israele, salvato da Hashem.", "These are Moses' last words before his death: how happy Israel is, a people saved by Hashem."], ["זֹאת", "Questa è la terra che ho giurato ad Abramo, Isacco e Giacobbe", "This is the land that I swore to Abraham, Isaac and Jacob", "Dalla cima si vede tutta la Terra.", "From the summit the whole Land can be seen.", "Dalla cima del Nevo, Hashem mostrò a Mosè tutta la terra promessa ai Patriarchi, e lì Mosè morì.", "From the top of Mount Nebo, Hashem showed Moses the whole land promised to the Patriarchs, and there Moses died."]]);

/* ===== Dashboard ===== */
function dashboard(){
  const t=T(),seen=Q.filter(q=>status(q)!=="new").length,m=masteredCount(),due=Q.filter(isDue).length;
  let a=0,b=0;Object.values(S.q).forEach(r=>{a+=r.w+r.t;b+=r.n*2});const acc=b?Math.round(a/b*100):0;
  const wstat=WORLDS.map(w=>{const pool=Q.filter(q=>q.w===w.id),rs=pool.map(rec).filter(r=>r&&r.n);const c=rs.reduce((s,r)=>s+r.w+r.t,0),tot=rs.reduce((s,r)=>s+r.n*2,0);return {w,pool:pool.length,mast:pool.filter(q=>status(q)==="mastered").length,acc:tot?c/tot:null,seen:rs.length}});
  const ranked=wstat.filter(x=>x.acc!==null&&x.seen>=2).sort((x,y)=>y.acc-x.acc),strong=ranked[0],weak=ranked.length>1?ranked[ranked.length-1]:null;
  const ri=rankIdx();
  screen(t.dashT,`
  <section class="card lvlcard"><span class="badge-l" aria-hidden="true">${["🧭","📘","🦉","📜","🏆"][ri]}</span><div class="info"><b>${t.ranks[ri]}</b><small>${RANKS[ri+1]?t.toNext(RANKS[ri+1]-m):t.topRank}</small></div><span class="xp">${S.xp} ${t.xp}</span></section>
  <div class="stats">
    <div class="card stat"><b>${seen}<span style="font-size:16px">/${Q.length}</span></b><small>${t.sSeen}</small></div>
    <div class="card stat"><b>${m}</b><small>${t.sMast}</small></div>
    <div class="card stat"><b>${acc}%</b><small>${t.sAcc}</small></div>
    <div class="card stat"><b>${due}</b><small>${t.sDue}</small></div>
    <div class="card stat"><b>${S.streak.last===today()||S.streak.last===ymd(new Date(Date.now()-864e5))?S.streak.cur:0} 🔥</b><small>${t.sStreak}</small></div>
    <div class="card stat"><b>${S.streak.best}</b><small>${t.sBest}</small></div>

  ${due?`<button class="cta" id="dueGo" style="font-size:20px">🔁 ${t.mReview(due)[0]} (${due})</button>`:""}

  <section class="card wbars">${wstat.map(x=>`<div class="wbar"><span>${x.w.em} ${WN(x.w)}${x===strong?`<span class="tag strong">${t.strong}</span>`:""}${x===weak&&weak!==strong?`<span class="tag weak">${t.weak}</span>`:""}</span><span class="bar"><i style="width:${Math.round(x.mast/x.pool*100)}%"></i></span><span>${x.mast}/${x.pool}</span></div>`).join("")}</section>
  <h2 class="sec">${t.achT}</h2>
  <div class="badges">${Object.keys(t.badges).map(k=>`<div class="badge ${S.badges[k]?"got":""}"><span class="em">${BADGE_EM[k]}</span><b>${t.badges[k][0]}</b><small>${t.badges[k][1]}</small></div>`).join("")}</div>
  <p class="card privacy">🔒 ${t.privacy}</p>
  <div id="resetBox"><button class="danger" id="reset">${t.reset}</button></div>`,home,dashboard);

}

 it:["Il timido non impara,","e l’irascibile non insegna","Chi si vergogna di fare domande impara poco, e chi si arrabbia subito non sa insegnare. Quindi: domande senza paura!"],
 en:["The bashful one does not learn,","and the short-tempered one cannot teach","Someone too shy to ask questions won’t learn much, and a teacher who gets angry fast can’t teach well. So ask without fear!"]},
{c:2,src:"אבות ב׳, ה׳",lvl:1,who:"הלל",h:"בְּמָקוֹם שֶׁאֵין אֲנָשִׁים,",a:"הִשְׁתַּדֵּל לִהְיוֹת אִישׁ",
 ctx:"כשאף אחד לא לוקח אחריות, אני יכול להיות זה שעוזר ועושה את הדבר הנכון.",
 it:["Dove non ci sono uomini,","sforzati di essere un uomo","Quando nessuno si prende la responsabilità, posso essere io quello che aiuta e fa la cosa giusta."],
 en:["In a place where there are no people,","strive to be a person","When nobody takes responsibility, I can be the one who helps and does the right thing."]},
{c:2,src:"אבות ב׳, ח׳",lvl:2,who:"רבן יוחנן בן זכאי",h:"אִם לָמַדְתָּ תוֹרָה הַרְבֵּה, אַל תַּחֲזִיק טוֹבָה לְעַצְמְךָ,",a:"כִּי לְכָךְ נוֹצָרְתָּ",
 ctx:"מי שלמד הרבה לא צריך להתגאות, כי בשביל זה בדיוק נברא: ללמוד ולגדול.",
 it:["Se hai studiato molta Torah, non vantartene,","perché è per questo che sei stato creato","Chi ha studiato molto non deve vantarsi: è proprio per questo che è stato creato, per imparare e crescere."],
 en:["If you have learned much Torah, do not take credit for yourself,","for that is why you were created","Someone who has learned a lot shouldn’t boast, because that is exactly what we were created for: to learn and grow."]},
{c:2,src:"אבות ב׳, י׳",lvl:2,who:"רבי אליעזר",h:"יְהִי כְבוֹד חֲבֵרְךָ חָבִיב עָלֶיךָ כְּשֶׁלָּךְ,",a:"וְאַל תְּהִי נוֹחַ לִכְעֹס",
 ctx:"כמו שאני רוצה שיכבדו אותי, כך אכבד את החבר שלי. ולא כועסים מהר!",
 it:["Che l’onore del tuo compagno ti sia caro come il tuo,","e non arrabbiarti facilmente","Come voglio essere rispettato io, così rispetto il mio amico. E non ci si arrabbia subito!"],
 en:["Let your friend’s honor be as dear to you as your own,","and do not be quick to anger","Just as I want to be respected, I respect my friend. And don’t get angry quickly!"]},
{c:2,src:"אבות ב׳, ט״ו",lvl:3,who:"רבי טרפון",h:"הַיּוֹם קָצָר וְהַמְּלָאכָה מְרֻבָּה,",a:"וְהַפּוֹעֲלִים עֲצֵלִים, וְהַשָּׂכָר הַרְבֵּה, וּבַעַל הַבַּיִת דּוֹחֵק",
 ctx:"החיים הם כמו יום עבודה קצר, ויש הרבה מה ללמוד ולעשות. השכר גדול, אז כדאי לא להתעצל!",
 it:["Il giorno è breve e il lavoro è tanto,","gli operai sono pigri, la ricompensa è grande e il padrone di casa incalza","La vita è come una breve giornata di lavoro con tanto da fare. La ricompensa è grande: non conviene essere pigri!"],
 en:["The day is short and the work is great,","the workers are lazy, the reward is great, and the Master is pressing","Life is like a short workday with lots to do. The reward is great, so it’s worth not being lazy!"]},
{c:2,src:"אבות ב׳, ט״ז",lvl:1,who:"רבי טרפון",h:"לֹא עָלֶיךָ הַמְּלָאכָה לִגְמֹר,",a:"וְלֹא אַתָּה בֶן חוֹרִין לִבָּטֵל מִמֶּנָּה",
 ctx:"לא חייבים לגמור את כל התורה לבד, אבל גם אסור לוותר. כל אחד עושה את החלק שלו.",
 it:["Non spetta a te completare il lavoro,","ma non sei libero di sottrartene","Non devi finire tutto da solo, ma non puoi nemmeno rinunciare. Ognuno fa la sua parte."],
 en:["It is not your duty to finish the work,","but you are not free to stop doing it","You don’t have to finish everything alone, but you can’t give up either. Everyone does their part."]},
/* ---- פרק ג׳ ---- */
{c:3,src:"אבות ג׳, א׳",lvl:3,who:"עקביא בן מהללאל",h:"הִסְתַּכֵּל בִּשְׁלשָׁה דְבָרִים וְאִי אַתָּה בָא לִידֵי עֲבֵרָה.",a:"דַּע מֵאַיִן בָּאתָ, וּלְאָן אַתָּה הוֹלֵךְ, וְלִפְנֵי מִי אַתָּה עָתִיד לִתֵּן דִּין וְחֶשְׁבּוֹן",
 ctx:"מי שזוכר מאיפה בא, לאן הוא הולך ולפני מי יעמוד, ישמור על עצמו מלעשות דברים רעים.",
 it:["Rifletti su tre cose e non cadrai nella trasgressione:","sappi da dove vieni, dove stai andando e davanti a chi dovrai rendere conto","Chi ricorda da dove viene, dove va e davanti a chi starà, si tiene lontano dal male."],
 en:["Reflect on three things and you will not come to sin:","know where you came from, where you are going, and before Whom you will give an account","Remembering where we came from, where we are going and before Whom we will stand keeps us away from doing wrong."]},
{c:3,src:"אבות ג׳, ב׳",lvl:3,who:"רבי חנינא סגן הכהנים",h:"הֱוֵי מִתְפַּלֵּל בִּשְׁלוֹמָהּ שֶׁל מַלְכוּת,",a:"שֶׁאִלְמָלֵא מוֹרָאָהּ, אִישׁ אֶת רֵעֵהוּ חַיִּים בְּלָעוֹ",
 ctx:"צריך להתפלל שיהיה שלטון מסודר וחוקים, כי בלי סדר אנשים היו פוגעים זה בזה.",
 it:["Prega per il benessere del governo,","perché senza il suo timore, gli uomini si divorerebbero vivi l’un l’altro","Bisogna pregare che ci sia un governo e delle leggi: senza ordine, le persone si farebbero del male a vicenda."],
 en:["Pray for the welfare of the government,","for without fear of it, people would swallow each other alive","We should pray for order and laws, because without them people would harm one another."]},
{c:3,src:"אבות ג׳, ט׳",lvl:3,who:"רבי חנינא בן דוסא",h:"כָּל שֶׁיִּרְאַת חֶטְאוֹ קוֹדֶמֶת לְחָכְמָתוֹ,",a:"חָכְמָתוֹ מִתְקַיֶּמֶת",
 ctx:"מי שקודם כול רוצה להיות אדם טוב ולא לחטוא, החוכמה שלו תישאר איתו ותצמח.",
 it:["Chi mette il timore del peccato prima della sua sapienza,","la sua sapienza dura","Chi prima di tutto vuole essere una persona buona, vedrà la sua sapienza restare e crescere."],
 en:["Whoever puts fear of sin before his wisdom,","his wisdom will endure","Someone who first of all wants to be a good person will see his wisdom last and grow."]},
{c:3,src:"אבות ג׳, י״ב",lvl:2,who:"רבי ישמעאל",h:"הֱוֵי מְקַבֵּל אֶת כָּל הָאָדָם",a:"בְּשִׂמְחָה",
 ctx:"פשוט וחשוב: לפגוש כל אחד בשמחה, גם מי שאנחנו לא מכירים.",
 it:["Accogli ogni persona","con gioia","Semplice e importante: incontrare ognuno con gioia, anche chi non conosciamo."],
 en:["Receive every person","with joy","Simple and important: greet everyone with joy, even people we don’t know."]},
{c:3,src:"אבות ג׳, י״ד",lvl:1,who:"רבי עקיבא",h:"חָבִיב אָדָם",a:"שֶׁנִּבְרָא בְצֶלֶם",
 ctx:"כל אדם יקר וחשוב, כי ה׳ ברא אותו ״בצלם אלוקים״. לכן מכבדים כל אחד.",
 it:["Caro è l’uomo,","perché è stato creato a immagine","Ogni persona è preziosa, perché Hashem l’ha creata «a Sua immagine». Per questo rispettiamo tutti."],
 en:["Beloved is man,","for he was created in the image","Every person is precious because Hashem created them “in His image.” That’s why we respect everyone."]},
{c:3,src:"אבות ג׳, ט״ו",lvl:2,who:"רבי עקיבא",h:"הַכֹּל צָפוּי,",a:"וְהָרְשׁוּת נְתוּנָה",
 ctx:"ה׳ יודע הכול מראש, ובכל זאת אנחנו בוחרים בעצמנו מה לעשות. הבחירה בידיים שלנו!",
 it:["Tutto è previsto,","eppure la libertà è data","Hashem sa tutto in anticipo, eppure siamo noi a scegliere cosa fare. La scelta è nelle nostre mani!"],
 en:["Everything is foreseen,","yet freedom of choice is given","Hashem knows everything in advance, and still we choose what to do. The choice is in our hands!"]},
{c:3,src:"אבות ג׳, י״ז",lvl:2,who:"רבי אלעזר בן עזריה",h:"אִם אֵין תּוֹרָה, אֵין דֶּרֶךְ אֶרֶץ;",a:"אִם אֵין דֶּרֶךְ אֶרֶץ, אֵין תּוֹרָה",
 ctx:"״דרך ארץ״ היא התנהגות יפה ומנומסת. תורה והתנהגות טובה הולכות יחד, כל אחת צריכה את השנייה.",
 it:["Se non c’è Torah, non c’è buona condotta;","se non c’è buona condotta, non c’è Torah","«Derech eretz» sono le buone maniere. Torah e buon comportamento vanno insieme: l’una ha bisogno dell’altra."],
 en:["Where there is no Torah, there are no good manners;","where there are no good manners, there is no Torah","“Derech eretz” means good behavior. Torah and good manners go together; each needs the other."]},
/* ---- פרק ד׳ ---- */
{c:4,src:"אבות ד׳, א׳",lvl:1,who:"בן זומא",h:"אֵיזֶהוּ חָכָם?",a:"הַלּוֹמֵד מִכָּל אָדָם",
 ctx:"חכם אמיתי הוא לא מי שיודע הכול, אלא מי שמוכן ללמוד מכל אחד, גם מילד קטן.",
 it:["Chi è saggio?","Chi impara da ogni persona","Il vero saggio non è chi sa tutto, ma chi è pronto a imparare da chiunque, anche da un bambino."],
 en:["Who is wise?","One who learns from every person","A truly wise person isn’t one who knows everything, but one who is ready to learn from anyone, even a small child."]},
{c:4,src:"אבות ד׳, א׳",lvl:1,who:"בן זומא",h:"אֵיזֶהוּ גִבּוֹר?",a:"הַכּוֹבֵשׁ אֶת יִצְרוֹ",
 ctx:"גיבור אמיתי הוא לא החזק בשרירים, אלא מי שמצליח לשלוט בעצמו, למשל לא להתפרץ בכעס.",
 it:["Chi è forte?","Chi domina il proprio istinto","Il vero forte non è chi ha i muscoli, ma chi sa controllarsi, per esempio senza esplodere di rabbia."],
 en:["Who is strong?","One who conquers his urges","A true hero isn’t the one with big muscles, but the one who controls himself, for example by not exploding in anger."]},
{c:4,src:"אבות ד׳, א׳",lvl:1,who:"בן זומא",h:"אֵיזֶהוּ עָשִׁיר?",a:"הַשָּׂמֵחַ בְּחֶלְקוֹ",
 ctx:"עשיר אמיתי הוא מי ששמח במה שיש לו, ולא כל הזמן רוצה עוד ועוד.",
 it:["Chi è ricco?","Chi è contento di ciò che ha","Il vero ricco è chi è felice di ciò che ha, e non vuole sempre di più."],
 en:["Who is rich?","One who is happy with what he has","Truly rich is the one who is happy with what they have, instead of always wanting more."]},
{c:4,src:"אבות ד׳, א׳",lvl:2,who:"בן זומא",h:"אֵיזֶהוּ מְכֻבָּד?",a:"הַמְכַבֵּד אֶת הַבְּרִיּוֹת",
 ctx:"מי שמכבד אחרים, אחרים מכבדים אותו. הכבוד מגיע למי שנותן כבוד.",
 it:["Chi è onorato?","Chi onora le creature","Chi rispetta gli altri viene rispettato. L’onore arriva a chi sa onorare."],
 en:["Who is honored?","One who honors others","Whoever respects others is respected. Honor comes to the one who gives honor."]},
{c:4,src:"אבות ד׳, ב׳",lvl:2,who:"בן עזאי",h:"הֱוֵי רָץ לְמִצְוָה קַלָּה כְבַחֲמוּרָה, וּבוֹרֵחַ מִן הָעֲבֵרָה,",a:"שֶׁמִּצְוָה גּוֹרֶרֶת מִצְוָה, וַעֲבֵרָה גוֹרֶרֶת עֲבֵרָה",
 ctx:"מצווה אחת מושכת אחריה עוד מצווה, כמו שרשרת. לכן כדאי לרוץ לעשות טוב!",
 it:["Corri verso una mitzvà leggera come verso una grave, e fuggi dalla trasgressione,","perché una mitzvà ne trascina un’altra e una trasgressione ne trascina un’altra","Una mitzvà ne porta un’altra, come una catena. Per questo conviene correre a fare il bene!"],
 en:["Run to a light mitzvah as to a weighty one, and flee from sin,","for one mitzvah brings another, and one sin brings another","One mitzvah pulls another after it, like a chain. So run to do good!"]},
{c:4,src:"אבות ד׳, ג׳",lvl:2,who:"בן עזאי",h:"אַל תְּהִי בָז לְכָל אָדָם,",a:"שֶׁאֵין לְךָ אָדָם שֶׁאֵין לוֹ שָׁעָה",
 ctx:"אסור לזלזל באף אחד. לכל אדם יגיע הרגע שבו הוא יהיה חשוב ויעשה משהו גדול.",
 it:["Non disprezzare nessuno,","perché non c’è persona che non abbia il suo momento","Non bisogna sottovalutare nessuno: per ognuno arriverà il momento in cui sarà importante."],
 en:["Do not look down on anyone,","for there is no person who does not have his hour","Never look down on anyone: everyone will have a moment when they matter and do something great."]},
{c:4,src:"אבות ד׳, ד׳",lvl:2,who:"רבי לויטס איש יבנה",h:"מְאֹד מְאֹד הֱוֵי",a:"שְׁפַל רוּחַ",
 ctx:"״שפל רוח״ פירושו עניו. החכמים אומרים ״מאוד מאוד״ כי ענווה היא מידה חשובה במיוחד.",
 it:["Sii molto, molto","umile di spirito","«Umile di spirito» vuol dire modesto. I saggi dicono «molto, molto» perché l’umiltà è una qualità speciale."],
 en:["Be very, very","humble in spirit","“Humble in spirit” means modest. The sages say “very, very” because humility is an especially important trait."]},
{c:4,src:"אבות ד׳, י״ג",lvl:2,who:"רבי שמעון",h:"שְׁלשָׁה כְתָרִים הֵם, כֶּתֶר תּוֹרָה וְכֶתֶר כְּהֻנָּה וְכֶתֶר מַלְכוּת,",a:"וְכֶתֶר שֵׁם טוֹב עוֹלֶה עַל גַּבֵּיהֶן",
 ctx:"יש כתר של תורה, של כהונה ושל מלכות. אבל הכתר הכי חשוב הוא שם טוב, ואותו כל אחד יכול להשיג.",
 it:["Ci sono tre corone: la corona della Torah, del sacerdozio e del regno,","ma la corona del buon nome le supera tutte","Ci sono le corone della Torah, del sacerdozio e del regno, ma la più importante è un buon nome, e chiunque può conquistarla."],
 en:["There are three crowns: the crown of Torah, of priesthood and of kingship,","but the crown of a good name rises above them all","There are crowns of Torah, priesthood and kingship, but the greatest is a good name, and anyone can earn it."]},
{c:4,src:"אבות ד׳, ט״ו",lvl:3,who:"רבי מתיא בן חרש",h:"הֱוֵי מַקְדִּים בִּשְׁלוֹם כָּל אָדָם,",a:"וֶהֱוֵי זָנָב לָאֲרָיוֹת, וְאַל תְּהִי רֹאשׁ לַשּׁוּעָלִים",
 ctx:"עדיף להיות האחרון בין אנשים טובים וחכמים (״אריות״) מאשר הראשון בין אנשים לא טובים (״שועלים״).",
 it:["Saluta per primo ogni persona,","e sii coda ai leoni piuttosto che testa alle volpi","Meglio essere l’ultimo tra persone buone e sagge («leoni») che il primo tra persone poco buone («volpi»)."],
 en:["Be first to greet every person,","and be a tail to lions rather than a head to foxes","Better to be last among good, wise people (“lions”) than first among bad ones (“foxes”)."]},
{c:4,src:"אבות ד׳, ט״ז",lvl:3,who:"רבי יעקב",h:"הָעוֹלָם הַזֶּה דּוֹמֶה לִפְרוֹזְדוֹר בִּפְנֵי הָעוֹלָם הַבָּא;",a:"הַתְקֵן עַצְמְךָ בַפְּרוֹזְדוֹר, כְּדֵי שֶׁתִּכָּנֵס לַטְּרַקְלִין",
 ctx:"העולם הזה הוא כמו מסדרון לפני אולם מלכותי. כאן מתכוננים במעשים טובים, כדי להיכנס לאולם.",
 it:["Questo mondo è come un corridoio davanti al mondo a venire;","preparati nel corridoio per poter entrare nel salone","Questo mondo è come un corridoio prima di una sala reale: qui ci prepariamo con buone azioni per poter entrare."],
 en:["This world is like a hallway before the World to Come;","prepare yourself in the hallway so that you may enter the banquet hall","This world is like a hallway before a royal hall: here we prepare with good deeds so we can enter."]},
{c:4,src:"אבות ד׳, כ״א",lvl:2,who:"רבי אלעזר הקפר",h:"הַקִּנְאָה וְהַתַּאֲוָה וְהַכָּבוֹד",a:"מוֹצִיאִין אֶת הָאָדָם מִן הָעוֹלָם",
 ctx:"קנאה באחרים, רצון לעוד ועוד, וחיפוש כבוד, מקלקלים לאדם את החיים ולא נותנים לו ליהנות ממה שיש לו.",
 it:["L’invidia, la bramosia e la ricerca di onore","portano l’uomo fuori dal mondo","Invidia, voglia di avere sempre di più e ricerca di onori rovinano la vita e non lasciano godere di ciò che si ha."],
 en:["Jealousy, desire and the chase for honor","take a person out of the world","Envy, always wanting more, and chasing honor ruin a person’s life and stop them enjoying what they have."]},
/* ---- פרק ה׳ ---- */
{c:5,src:"אבות ה׳, א׳",lvl:1,who:null,h:"בַּעֲשָׂרָה מַאֲמָרוֹת",a:"נִבְרָא הָעוֹלָם",

function avotScreen(){
  const t=T();setWorld("pirkei");
  const prog=pool=>{const seen=pool.filter(q=>status(q)!=="new").length,mast=pool.filter(q=>status(q)==="mastered").length;return {seen,mast,n:pool.length}};
  const all=prog(AV);
  screen(t.avT,`<p class="best">${t.avS}</p>
   <button class="card daily" id="avMix"><span class="em">📜</span><span class="tx"><b>${t.avMix}</b><small>${t.avMixS} · ${all.seen}/${all.n}</small></span><span class="go">${t.dir==="rtl"?"◂":"▸"}</span></button>
   <div class="pgrid">${[1,2,3,4,5,6].map(c=>{const p=prog(AV.filter(q=>q.c===c));
    return `<button class="card pbtn" data-c="${c}"><b>${t.avCh(c)}</b><span class="bar"><i style="width:${Math.round(p.seen/p.n*100)}%"></i></span><small>${p.seen}/${p.n}${p.mast===p.n?" 🥇":""}</small></button>`}).join("")}</div>${DEDIC}`,home,avotScreen);
  $("#avMix").onclick=()=>{window.scrollTo(0,0);start("avot",0)};
  document.querySelectorAll(".pbtn").forEach(b=>b.onclick=()=>{window.scrollTo(0,0);start("avot",+b.dataset.c)});
}

 it:["Getta su Hashem il tuo peso,","ed Egli ti sosterrà","«Il tuo peso» sono le preoccupazioni: possiamo affidarle a Hashem, e Lui si prenderà cura di noi."],

/* ---- c2: משוררים נוספים ---- */
{c:2,src:"תהלים קכ״ז, א׳",lvl:3,who:"שלמה",h:"אִם ה׳ לֹא יִבְנֶה בַיִת",a:"שָׁוְא עָמְלוּ בוֹנָיו בּוֹ",

 it:["Se Hashem non costruisce la casa,","invano vi faticano i costruttori","Re Salomone, che costruì il Santuario, insegna: senza l'aiuto di Hashem ogni sforzo è inutile."],
 en:["Unless Hashem builds the house,","its builders labor in vain","King Solomon, who built the Temple, teaches: without Hashem's help every effort is in vain."]},
{c:2,src:"תהלים צ׳, י״ב",lvl:3,who:"משה",h:"לִמְנוֹת יָמֵינוּ כֵּן הוֹדַע",a:"וְנָבִא לְבַב חָכְמָה",
 ctx:"המזמור הזה הוא תפילה של משה רבנו: ללמוד להעריך כל יום, כדי לחיות בחוכמה.",
 it:["Insegnaci a contare i nostri giorni","e avremo un cuore saggio","Questo salmo è una preghiera di Mosè: imparare a dare valore a ogni giorno, per vivere con saggezza."],
 en:["Teach us to count our days,","so we may gain a heart of wisdom","This psalm is a prayer of Moses: learn to value each day so that we live wisely."]},
{c:2,src:"תהלים פ״ד, ה׳",lvl:2,who:"בני קרח",h:"אַשְׁרֵי יוֹשְׁבֵי בֵיתֶךָ",a:"עוֹד יְהַלְלוּךָ סֶּלָה",
 ctx:"זה הפסוק הראשון של ״אשרי״. בני קרח היו משוררים במקדש.",
 it:["Felici quelli che abitano la Tua casa,","Ti loderanno sempre, selà","È il primo versetto dell'«Ashrè». I figli di Korach erano cantori nel Santuario."],
 en:["Happy are those who dwell in Your house;","they will always praise You, selah","This is the first verse of \"Ashrei\". The sons of Korah were singers in the Temple."]},
{c:2,src:"תהלים מ״ב, ב׳",lvl:3,who:"בני קרח",h:"כְּאַיָּל תַּעֲרֹג עַל אֲפִיקֵי מָיִם",a:"כֵּן נַפְשִׁי תַעֲרֹג אֵלֶיךָ אֱלֹהִים",
 ctx:"כמו אייל צמא שמחפש מים, כך הנשמה מתגעגעת להיות קרובה לה׳.",
 it:["Come la cerva anela ai corsi d'acqua,","così l'anima mia anela a Te, o D-o","Come un cervo assetato cerca l'acqua, così l'anima desidera essere vicina a Hashem."],
 en:["As a deer longs for streams of water,","so my soul longs for You, G-d","Like a thirsty deer seeking water, the soul longs to be close to Hashem."]},
{c:2,src:"תהלים מ״ו, ב׳",lvl:3,who:"בני קרח",h:"אֱלֹהִים לָנוּ מַחֲסֶה וָעֹז",a:"עֶזְרָה בְצָרוֹת נִמְצָא מְאֹד",
 ctx:"בזמנים קשים, ה׳ הוא כמו מקלט חזק שאפשר לברוח אליו.",
 it:["D-o è per noi rifugio e forza,","un aiuto sempre presente nelle difficoltà","Nei momenti difficili Hashem è come un rifugio forte in cui ripararsi."],
 en:["G-d is our refuge and strength,","a help ever present in trouble","In hard times Hashem is like a strong shelter to run to."]},
{c:2,src:"תהלים מ״ז, ב׳",lvl:2,who:"בני קרח",h:"כָּל הָעַמִּים תִּקְעוּ כָף",a:"הָרִיעוּ לֵאלֹהִים בְּקוֹל רִנָּה",

 it:["Popoli tutti, battete le mani,","acclamate D-o con voce di gioia","Questo salmo si recita sette volte prima dello shofar di Rosh Hashanà."],
 en:["All you nations, clap your hands,","shout to G-d with a joyful voice","This psalm is said seven times before the shofar on Rosh Hashanah."]},
{c:2,src:"תהלים ע״ג, כ״ח",lvl:3,who:"אסף",h:"וַאֲנִי קִרֲבַת אֱלֹהִים",a:"לִי טוֹב",
 ctx:"אסף היה ראש המשוררים בימי דוד. הוא מסכם: הדבר הכי טוב בשבילי זה להיות קרוב לה׳.",

 en:["As for me, nearness to G-d","is my good","Asaph led the Temple singers in David's time. He concludes: the best thing for me is to be close to Hashem."]},
{c:2,src:"תהלים פ״א, ב׳",lvl:3,who:"אסף",h:"הַרְנִינוּ לֵאלֹהִים עוּזֵּנוּ",a:"הָרִיעוּ לֵאלֹהֵי יַעֲקֹב",
 ctx:"זה שיר של יום חמישי, שהלויים שרו במקדש.",
 it:["Cantate con gioia a D-o, nostra forza,","acclamate il D-o di Giacobbe","È il salmo del giovedì, che i Leviti cantavano nel Santuario."],
 en:["Sing joyfully to G-d, our strength,","shout to the G-d of Jacob","This is the Thursday psalm that the Levites sang in the Temple."]},
{c:2,src:"תהלים פ״ט, ב׳",lvl:3,who:"איתן האזרחי",h:"חַסְדֵי ה׳ עוֹלָם אָשִׁירָה",a:"לְדֹר וָדֹר אוֹדִיעַ אֱמוּנָתְךָ בְּפִי",
 ctx:"איתן האזרחי היה חכם גדול בימי שלמה. הוא רוצה לספר על טוב ה׳ לכל הדורות.",
 it:["Canterò per sempre la bontà di Hashem,","di generazione in generazione farò conoscere la Tua fedeltà","Etan l'Ezrachita era un grande saggio ai tempi di Salomone. Vuole raccontare la bontà di Hashem a tutte le generazioni."],
 en:["I will sing of Hashem's kindness forever;","to every generation I will make known Your faithfulness","Ethan the Ezrahite was a great sage in Solomon's time. He wants to tell every generation about Hashem's goodness."]},

{c:3,src:"תהלים א׳, א׳",lvl:2,who:null,h:"אַשְׁרֵי הָאִישׁ",a:"אֲשֶׁר לֹא הָלַךְ בַּעֲצַת רְשָׁעִים",

 en:["Happy is the man","who does not follow the advice of the wicked","This is the very first verse of Tehillim: happy is the one who does not follow bad advice."]},
{c:3,src:"תהלים קכ״א, א׳",lvl:1,who:null,h:"אֶשָּׂא עֵינַי אֶל הֶהָרִים",a:"מֵאַיִן יָבֹא עֶזְרִי",

 it:["Alzo gli occhi verso i monti:","da dove verrà il mio aiuto?","Chi canta alza lo sguardo verso i monti e si chiede da dove arriverà l'aiuto. La risposta è nel versetto dopo: da Hashem."],
 en:["I lift my eyes to the mountains:","where will my help come from?","The singer looks up at the mountains and asks where help will come from. The next verse answers: from Hashem."]},
{c:3,src:"תהלים קכ״א, ב׳",lvl:2,who:null,h:"עֶזְרִי מֵעִם ה׳",a:"עֹשֵׂה שָׁמַיִם וָאָרֶץ",
 ctx:"מי שברא את השמיים ואת הארץ יכול לעזור בכל דבר.",
 it:["Il mio aiuto viene da Hashem,","che ha fatto il cielo e la terra","Chi ha creato il cielo e la terra può aiutare in ogni cosa."],
 en:["My help comes from Hashem,","Maker of heaven and earth","The One who created heaven and earth can help with anything."]},
{c:3,src:"תהלים קכ״א, ד׳",lvl:1,who:null,h:"הִנֵּה לֹא יָנוּם וְלֹא יִישָׁן",a:"שׁוֹמֵר יִשְׂרָאֵל",
 ctx:"גם כשאנחנו ישנים בלילה, ה׳ שומר עלינו כל הזמן.",
 it:["Ecco, non si assopisce e non dorme","il custode d'Israele","Anche quando dormiamo di notte, Hashem veglia su di noi senza sosta."],
 en:["Behold, He does not slumber or sleep,","the Guardian of Israel","Even while we sleep at night, Hashem watches over us all the time."]},
{c:3,src:"תהלים ק״נ, ו׳",lvl:1,who:null,h:"כֹּל הַנְּשָׁמָה תְּהַלֵּל יָהּ",a:"הַלְלוּ יָהּ",

 en:["Let every soul praise Hashem,","Halleluyah","This is the last verse of Tehillim: everything with a soul thanks Hashem."]},
{c:3,src:"תהלים קי״ח, כ״ד",lvl:1,who:null,h:"זֶה הַיּוֹם עָשָׂה ה׳",a:"נָגִילָה וְנִשְׂמְחָה בוֹ",

 en:["This is the day Hashem has made;","let us rejoice and be glad in it","We say it in Hallel on festivals: every day is a gift from Hashem, so let's be happy in it."]},
{c:3,src:"תהלים קל״ז, ה׳",lvl:2,who:null,h:"אִם אֶשְׁכָּחֵךְ יְרוּשָׁלִָם",a:"תִּשְׁכַּח יְמִינִי",

 en:["If I forget you, Jerusalem,","let my right hand forget","The Jews exiled in Babylon swore never to forget Jerusalem. That's why a glass is broken at weddings."]},
{c:3,src:"תהלים קכ״ו, א׳",lvl:2,who:null,h:"בְּשׁוּב ה׳ אֶת שִׁיבַת צִיּוֹן",a:"הָיִינוּ כְּחֹלְמִים",

 it:["Quando Hashem riporterà i ritornati a Sion,","saremo come chi sogna","Quando Hashem riporterà il popolo a Sion sembrerà un sogno. Si canta prima della birkat hamazon di Shabbat."],
 en:["When Hashem brings back the returnees to Zion,","we will be like dreamers","When Hashem brings the people back to Zion it will feel like a dream. We sing it before Birkat Hamazon on Shabbat."]},
{c:3,src:"תהלים קכ״ו, ה׳",lvl:3,who:null,h:"הַזֹּרְעִים בְּדִמְעָה",a:"בְּרִנָּה יִקְצֹרוּ",
 ctx:"כמו חקלאי שעובד קשה בזריעה ושמח בקציר: מאמץ היום מביא שמחה מחר.",

 en:["Those who sow in tears","will reap with songs of joy","Like a farmer who works hard sowing and rejoices at harvest: today's effort brings tomorrow's joy."]},
{c:3,src:"תהלים צ״ב, ב׳",lvl:2,who:null,h:"טוֹב לְהֹדוֹת לַה׳",a:"וּלְזַמֵּר לְשִׁמְךָ עֶלְיוֹן",

 en:["It is good to thank Hashem","and to sing to Your name, Most High","This is the \"psalm for the Shabbat day\": on Shabbat there is special time to give thanks and sing."]},
{c:3,src:"תהלים צ״ב, י״ג",lvl:2,who:null,h:"צַדִּיק כַּתָּמָר יִפְרָח",a:"כְּאֶרֶז בַּלְּבָנוֹן יִשְׂגֶּה",

{c:3,src:"תהלים ק׳, ב׳",lvl:1,who:null,h:"עִבְדוּ אֶת ה׳ בְּשִׂמְחָה",a:"בֹּאוּ לְפָנָיו בִּרְנָנָה",

{c:3,src:"תהלים קי״ג, ג׳",lvl:2,who:null,h:"מִמִּזְרַח שֶׁמֶשׁ עַד מְבוֹאוֹ",a:"מְהֻלָּל שֵׁם ה׳",

 it:["Dal sorgere del sole al suo tramonto","sia lodato il nome di Hashem","Da dove il sole sorge fino a dove tramonta, in tutto il mondo, si loda Hashem. È parte dell'Hallel."],
 en:["From the rising of the sun to its setting,","Hashem's name is praised","From where the sun rises to where it sets, all over the world, Hashem is praised. It's part of Hallel."]},
{c:3,src:"תהלים קל״ו, א׳",lvl:1,who:null,h:"הוֹדוּ לַה׳ כִּי טוֹב",a:"כִּי לְעוֹלָם חַסְדּוֹ",

{c:3,src:"תהלים קי״א, י׳",lvl:2,who:null,h:"רֵאשִׁית חָכְמָה",a:"יִרְאַת ה׳",

function thList(c){
  let out=pickQs(ROUND,c?TH.filter(q=>q.c===c):TH);
  if(!c){const D=q=>q.who==="דוד",dav=out.filter(D);
    if(dav.length>2){const ids=new Set(out.map(q=>q.id)),extra=pickQs(dav.length-2,TH.filter(q=>!D(q)),ids);out=out.filter(q=>!D(q)).concat(dav.slice(0,2),extra)}}

<script>
/* ===== Analytics (Umami, senza cookie) ===== */
(function(){
  function ev(name,data){try{if(window.umami&&umami.track)umami.track(name,data)}catch(e){}}
  function gioco(m){return m==="avot"?"pirke_avot":m==="tehillim"?"tehillim":"tanakh"}
  function filtro(mode,arg){try{if(mode==="parasha"&&typeof arg==="number")return PARASHOT[arg][1];if(mode==="world"&&typeof arg==="string")return arg;if((mode==="avot"||mode==="tehillim")&&arg!=null&&!Array.isArray(arg))return String(arg)}catch(e){}return ""}
  function wrap(name,fn){var o=window[name];if(typeof o!=="function")return;window[name]=function(){try{fn.apply(this,arguments)}catch(e){}return o.apply(this,arguments)}}
  var dopoRisultato=false,ultimaSezione="";

  // Partite
  var _start=window.start;
  window.start=function(mode,arg){
    var lang=LANG;
    if(dopoRisultato)ev("rigioca",{gioco:gioco(mode),modalita:mode,lingua:lang});
    dopoRisultato=false;ultimaSezione="";
    var r=_start.apply(this,arguments);
    try{if(st&&st.list&&st.list.length&&st.i===0){var d={gioco:gioco(mode),modalita:mode,lingua:lang,domande:st.list.length};var f=filtro(mode,arg);if(f)d.filtro=f;if(mode==="family"&&st.players)d.giocatori=st.players.length;ev("partita_iniziata",d)}}catch(e){}
    return r;
  };
  // Una risposta per domanda, in tutte le modalità
  wrap("record",function(q,okW,okT,hint){
    var completa=q&&q.who?(okW&&okT):okT;
    ev("risposta",{gioco:gioco(st&&st.mode),modalita:st&&st.mode,domanda:(st?st.i+1:0),esito:completa?"giusta":(okW||okT)?"parziale":"sbagliata",aiuto:!!hint,livello:(q&&q.lvl)||0});
  });
  wrap("summary",function(){
    var n=st.log.length||st.list.length,max=n*3;
    ev("partita_finita",{gioco:gioco(st.mode),modalita:st.mode,lingua:LANG,punteggio:st.score,massimo:max,percentuale:max?Math.round(st.score/max*100):0,aiuti:st.hints||0});
    dopoRisultato=true;
  });
  wrap("resume",function(){try{ev("partita_ripresa",{gioco:gioco(S.session&&S.session.mode),modalita:S.session&&S.session.mode})}catch(e){}});

  // Sezioni visitate (una volta per visita, non a ogni ridisegno)
  [["avotScreen","pirke_avot"],["thScreen","tehillim"],["mapScreen","mappa_mondi"],["parashaScreen","parashot"],["modesScreen","altri_giochi"],["familySetup","famiglia"],["settings","impostazioni"],["dashboard","progressi"]].forEach(function(x){
    wrap(x[0],function(){if(ultimaSezione!==x[1]){ultimaSezione=x[1];ev("sezione",{nome:x[1],lingua:LANG})}});
  });
  wrap("home",function(){ultimaSezione=""});

  // Clic: lingua, audio, impostazioni
  document.addEventListener("click",function(e){
    var b=e.target&&e.target.closest&&e.target.closest("button");if(!b)return;
    if(b.dataset.biglang)ev("lingua",{lingua:b.dataset.biglang,momento:"benvenuto"});
    else if(b.classList.contains("lang")&&b.dataset.lang&&b.dataset.lang!==LANG)ev("lingua",{lingua:b.dataset.lang,momento:"cambio"});
    else if(b.id==="mute")ev("audio",{stato:muted?"acceso":"spento"});
    else if(b.getAttribute("role")==="switch")ev("impostazione",{nome:b.id,valore:b.getAttribute("aria-checked")==="true"?"off":"on"});
  },true);
})();
</script>
