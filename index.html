<style>
/* Layout: golden-hour storybook sky with layered painted mountains and floating sparkles; soft glowing glass cards in one column. Single cinematic look by design. */
:root{
  color-scheme:light;
  --ink:#3a2453; --ink-soft:#6d5a86; --glass:rgba(255,252,246,.86); --paper:#fffaf1;

}
html,body{background:#ffcf9e;color:var(--ink);min-height:100%}

/* world */
.world{position:fixed;inset:0;z-index:0;overflow:hidden;background:linear-gradient(180deg,var(--k0) 0%,var(--k1) 22%,var(--k2) 50%,var(--k3) 70%,var(--k4) 100%)}
.glow{position:absolute;left:50%;top:44%;width:520px;height:520px;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle,var(--gl) 0%,#ffe08a 18%,rgba(255,190,120,.45) 40%,rgba(255,170,140,0) 70%);animation:breath 6s ease-in-out infinite}
@keyframes breath{50%{transform:translate(-50%,-50%) scale(1.06);opacity:.9}}
.cloud{position:absolute;height:46px;border-radius:50px;background:linear-gradient(#fff,#ffd9e6);opacity:.85;filter:blur(.4px);box-shadow:0 8px 20px rgba(150,60,120,.15);animation:drift linear infinite}
.cloud::before,.cloud::after{content:"";position:absolute;border-radius:50%;background:inherit}
.cloud::before{width:56px;height:56px;top:-28px;right:20px}.cloud::after{width:40px;height:40px;top:-18px;right:66px}
.c1{top:110px;width:150px;animation-duration:70s}.c2{top:230px;width:110px;animation-duration:90s;animation-delay:-45s;opacity:.6}.c3{top:60px;width:96px;animation-duration:80s;animation-delay:-20s;opacity:.7}
@keyframes drift{from{transform:translateX(-180px)}to{transform:translateX(calc(100vw + 180px))}}
.hills{position:absolute;bottom:0;left:0;width:100%;height:46vh;min-height:260px}

.app{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:16px;position:relative;z-index:1}
button{font-family:var(--f-display);cursor:pointer;color:var(--ink);border:0;-webkit-tap-highlight-color:transparent;transition:transform .18s cubic-bezier(.3,1.5,.5,1),box-shadow .18s}

.mascot{display:flex;align-items:flex-end;gap:10px}

.bubble::after{content:"";position:absolute;bottom:12px;right:-9px;width:20px;height:20px;background:var(--paper);transform:rotate(45deg);border-radius:4px}
@keyframes bob{50%{transform:translateY(-7px) rotate(-3deg)}}

.hero::before{content:"";position:absolute;inset:-40% -20% auto;height:160px;background:radial-gradient(ellipse,rgba(255,215,140,.55),transparent 70%);pointer-events:none}
.logo{font-family:var(--f-display);font-weight:700;font-size:clamp(50px,14vw,74px);line-height:1;position:relative}

@keyframes bubble-tilt{0%,100%{transform:rotate(2.5deg)}50%{transform:rotate(-1.5deg) translateY(-.03em)}}
.logo .tw{position:absolute;font-size:26px;animation:twinkle 2.2s ease-in-out infinite;background:none;color:#fff;filter:drop-shadow(0 0 6px #ffe08a)}
@keyframes rise{from{transform:translateY(30px) scale(.7);opacity:0}}
.hero p{margin:0;font-size:18px;color:var(--ink-soft)}
.levels{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.level{background:var(--glass);border-radius:24px;padding:14px 4px;font-size:18px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:2px;box-shadow:var(--shadow);border:2px solid transparent}

.cta{color:#fff;border-radius:28px;padding:18px;font-size:26px;font-weight:700;background:linear-gradient(180deg,#ff9cc0,var(--rose) 50%,var(--rose2));box-shadow:0 10px 24px rgba(200,40,100,.45),inset 0 2px 0 rgba(255,255,255,.6),inset 0 -4px 0 rgba(140,20,70,.35);text-shadow:0 2px 4px rgba(120,10,60,.4);position:relative;overflow:hidden}

.best{text-align:center;color:#fff;text-shadow:0 1px 6px rgba(90,20,80,.5);font-size:16px}

.verse::before{right:-14px}.verse::after{left:-14px}
.lvtag{align-self:flex-start;background:linear-gradient(180deg,#a78bff,var(--violet2));color:#fff;border-radius:999px;padding:1px 14px;font-family:var(--f-display);font-size:15px;box-shadow:0 4px 10px rgba(95,68,201,.35)}

.pill:disabled{opacity:.5}
.note{text-align:center;font-size:15px;color:var(--ink-soft)}

.step{display:flex;justify-content:center}

.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.opt{background:var(--glass);border-radius:28px;padding:12px 8px 14px;font-size:21px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:4px;box-shadow:var(--shadow);animation:pop .5s cubic-bezier(.3,1.5,.5,1) both;border:2px solid rgba(255,255,255,.9)}
.opt:nth-child(2){animation-delay:.07s}.opt:nth-child(3){animation-delay:.14s}.opt:nth-child(4){animation-delay:.21s}
.opt svg{width:84px;height:84px;filter:drop-shadow(0 6px 8px rgba(90,30,90,.25));transition:transform .25s cubic-bezier(.3,1.5,.5,1)}
.opt:not(:disabled):hover{transform:translateY(-4px)}
.opt:not(:disabled):hover svg{transform:scale(1.08) rotate(-4deg)}
.opt:disabled{cursor:default}
.opt.right{background:linear-gradient(180deg,#eaffdf,#b9f09e);box-shadow:0 0 0 4px #fff,0 0 30px 6px rgba(127,211,106,.8);animation:jump .7s cubic-bezier(.3,1.5,.5,1)}
.opt.wrong{background:linear-gradient(180deg,#fff0f3,#ffd0dc);animation:wob .4s ease 2}

.feedback{padding:20px 18px;display:flex;flex-direction:column;gap:12px;animation:pop .5s cubic-bezier(.3,1.5,.5,1)}

const TR=[
["השמר","Sono forse io il custode di mio fratello?","Am I my brother's keeper?",
 "Dopo che Abele scompare, Hashem chiede: «Dov'è tuo fratello?»","After Abel disappears, Hashem asks: “Where is your brother?”",
 "Caino uccise suo fratello Abele. Quando Hashem gli chiese dove fosse, Caino evitò la responsabilità e rispose con una domanda.","Cain killed his brother Abel. When Hashem asked where Abel was, Cain dodged the blame and answered with a question."],
["מי","Chi ti ha detto che eri nudo?","Who told you that you were naked?",
 "Succede nel Giardino dell'Eden, subito dopo aver mangiato dall'albero della conoscenza.","It happens in the Garden of Eden, right after eating from the tree of knowledge.",
 "Dopo aver mangiato il frutto proibito, Adamo ed Eva si nascosero. Hashem chiese ad Adamo come mai all'improvviso sapesse di essere nudo.","After eating the forbidden fruit, Adam and Eve hid. Hashem asked Adam how he suddenly knew he was naked."],
["שלח","Lascia andare il mio popolo, perché mi festeggi nel deserto.","Let My people go, so they may celebrate for Me in the desert.",
 "Chi parla è in un palazzo in Egitto, con il fratello Aronne accanto.","The speaker stands in a palace in Egypt, with his brother Aaron beside him.",
 "Mosè e Aronne andarono dal Faraone a nome di Hashem e chiesero di liberare i figli d'Israele. Il Faraone rifiutò e iniziarono le piaghe.","Moses and Aaron went to Pharaoh in Hashem's name and asked him to free the Israelites. Pharaoh refused, and the plagues began."],
["כי","Dove andrai tu, andrò anch'io; dove dormirai tu, dormirò anch'io.","Where you go, I will go; where you stay, I will stay.",
 "Una nuora moabita si rifiuta di lasciare la suocera.","A Moabite daughter-in-law refuses to leave her mother-in-law.",
 "Naomi chiese alle nuore di tornare a casa delle loro madri. Orpa tornò, ma Rut rimase con lei e si unì al popolo d'Israele.","Naomi told her daughters-in-law to go back home. Orpah went back, but Ruth stayed with her and joined the people of Israel."],
["אני","Io sono Giuseppe! Mio padre è ancora vivo?","I am Joseph! Is my father still alive?",
 "Il vice del re d'Egitto svela un segreto tenuto nascosto a lungo.","The viceroy of Egypt reveals a secret he has kept for a long time.",
 "Dopo molti anni Giuseppe non riuscì più a trattenersi e si rivelò ai fratelli che lo avevano venduto. La prima cosa che chiese fu del padre.","After many years Joseph could no longer hold back and revealed himself to the brothers who sold him. His first question was about his father."],
["הבה","Dammi dei figli, altrimenti io muoio!","Give me children, or else I will die!",
 "Era gelosa della sorella, che aveva avuto molti figli.","She was jealous of her sister, who had many children.",
 "Rachele, la moglie amata di Giacobbe, non riusciva ad avere figli. Con dolore e gelosia verso la sorella Lea, si rivolse a Giacobbe.","Rachel, Jacob's beloved wife, could not have children. In pain and jealous of her sister Leah, she turned to Jacob."],
["אתה","Quell'uomo sei tu!","You are the man!",
 "Un profeta racconta al re una parabola sull'agnellina di un povero.","A prophet tells the king a parable about a poor man's little lamb.",
 "Il profeta Natan raccontò a Davide di un ricco che prese l'unica pecorella di un povero. Davide si arrabbiò, e Natan gli disse che la storia parlava di lui.","Nathan told David about a rich man who took a poor man's only lamb. David grew angry, and Nathan told him the story was about him."],
["אתה","Tu vieni contro di me con spada, lancia e giavellotto.","You come to me with a sword, a spear and a javelin.",
 "Un giovane pastore con fionda e sassi affronta un guerriero gigante.","A young shepherd with a sling and stones faces a giant warrior.",
 "Il giovane Davide affrontò Golia il Filisteo. Golia confidava nelle sue armi, Davide disse che veniva nel nome di Hashem.","Young David faced Goliath the Philistine. Goliath trusted his weapons, and David said he came in Hashem's name."],
["דבר","Parla, perché il tuo servo ascolta.","Speak, for Your servant is listening.",
 "Un bambino che serviva nel santuario sentì chiamare il suo nome di notte, tre volte.","A boy serving in the sanctuary heard his name called at night, three times.",
 "Il piccolo Samuele pensava che lo chiamasse il sacerdote Eli. Eli capì che era Hashem e gli insegnò a rispondere così.","Young Samuel thought Eli the priest was calling him. Eli understood it was Hashem and taught him to answer this way."],
["תן","Dammi le persone, e i beni tienili per te.","Give me the people, and keep the goods for yourself.",
 "Dopo la guerra dei re, quando Abram salvò Lot.","After the war of the kings, when Abram rescued Lot.",
 "Abram vinse la guerra e liberò i prigionieri. Il re di Sodoma gli offrì il bottino, ma Abram rifiutò di prendere anche solo un filo.","Abram won the war and freed the captives. The king of Sodom offered him the spoils, but Abram refused to take even a thread."],
["לך","Vattene dalla tua terra e dal tuo luogo natale.","Go forth from your land and your birthplace.",
 "L'inizio del grande viaggio del primo patriarca.","The start of the great journey of the first forefather.",
 "Hashem chiese ad Abram di lasciare la sua terra e la casa di suo padre e di andare nella terra che gli avrebbe mostrato.","Hashem asked Abram to leave his land and his father's house and go to the land He would show him."],
["עשה","Fatti un'arca di legno di cipresso.","Make yourself an ark of gopher wood.",
 "Prima che l'acqua coprisse tutta la terra.","Before the water covered the whole earth.",
 "Hashem decise di mandare il diluvio e ordinò a Noè di costruire una grande arca per la sua famiglia e per animali di ogni specie.","Hashem decided to bring a flood and told Noah to build a great ark for his family and animals of every kind."],
["מכרה","Vendimi oggi la tua primogenitura.","Sell me your birthright today.",
 "Un fratello torna affamato dai campi, l'altro cucina una zuppa di lenticchie.","One brother comes home hungry from the field, the other is cooking lentil stew.",
 "Esaù tornò stanco e affamato. Giacobbe gli offrì la zuppa in cambio della primogenitura, ed Esaù accettò.","Esau came back tired and hungry. Jacob offered him stew in exchange for the birthright, and Esau agreed."],
["של","Togliti i sandali dai piedi.","Take your shoes off your feet.",
 "Vicino a un roveto che brucia ma non si consuma.","Next to a bush that burns but is not burned up.",
 "Mosè pascolava il gregge di Ietro e vide un roveto ardente. Hashem lo chiamò dal roveto e gli disse che quel luogo era santo.","Moses was tending Jethro's flock and saw a burning bush. Hashem called him from the bush and said the place was holy."],
["מי","Chi sono io per andare dal Faraone?","Who am I to go to Pharaoh?",
 "Chi parla non si sentiva adatto a una grande missione.","The speaker felt he was not right for a big mission.",
 "Hashem mandò Mosè a far uscire i figli d'Israele dall'Egitto. Mosè era umile e temeva di non esserne degno.","Hashem sent Moses to bring the Israelites out of Egypt. Moses was humble and feared he was not worthy."],
["מי","Chi è Hashem, perché io debba ascoltare la sua voce?","Who is Hashem, that I should listen to His voice?",
 "Il re d'Egitto si rifiuta di liberare il popolo.","The king of Egypt refuses to free the people.",
 "Mosè e Aronne chiesero al Faraone di lasciar andare il popolo. Il Faraone rispose con orgoglio che non conosceva Hashem.","Moses and Aaron asked Pharaoh to let the people go. Pharaoh proudly answered that he did not know Hashem."],
["הנחש","Il serpente mi ha ingannata e io ho mangiato.","The snake tricked me, and I ate.",
 "Nel Giardino dell'Eden, una donna spiega perché ha mangiato il frutto.","In the Garden of Eden, a woman explains why she ate the fruit.",
 "Hashem chiese a Eva che cosa avesse fatto, e lei diede la colpa al serpente che l'aveva convinta a mangiare.","Hashem asked Eve what she had done, and she blamed the snake that talked her into eating."],
["אף","Davvero Dio ha detto: non mangiate da nessun albero del giardino?","Did God really say you may not eat from any tree in the garden?",
 "La creatura più astuta di tutti gli animali.","The most cunning of all the animals.",
 "Il serpente cercò di confondere Eva chiedendo se fosse vietato mangiare da tutti gli alberi. Così cominciò la tentazione.","The snake tried to confuse Eve by asking if every tree was forbidden. That is how the temptation began."],
["מה","Che cosa ti ho fatto, che mi hai picchiata già tre volte?","What have I done to you, that you hit me three times?",
 "Un animale che all'improvviso si mette a parlare!","An animal that suddenly starts talking!",
 "L'asina vide un angelo che bloccava la strada e si fermò. Bil'am la picchiò, e Hashem le aprì la bocca.","The donkey saw an angel blocking the road and stopped. Balaam hit her, and Hashem opened her mouth."],
["חזק","Sii forte e coraggioso.","Be strong and brave.",
 "Subito dopo la morte di Mosè, al nuovo capo.","Right after Moses died, to the new leader.",
 "Dopo la morte di Mosè, Hashem incoraggiò Giosuè a guidare il popolo nella terra promessa.","After Moses died, Hashem encouraged Joshua to lead the people into the land."],
["שאל","Chiedi che cosa devo darti.","Ask what I should give you.",
 "In un sogno notturno, a un giovane re a Ghivon.","In a night dream, to a young king in Gibeon.",
 "Hashem apparve in sogno a Salomone e gli offrì qualsiasi cosa. Salomone chiese saggezza per giudicare il popolo.","Hashem appeared to Solomon in a dream and offered him anything. Solomon asked for wisdom to judge the people."],
["ומי","E chi sa se non sei arrivata al regno proprio per un momento come questo?","Who knows if you became queen for just such a time as this?",
 "Un cugino chiede alla regina di salvare il popolo.","A cousin asks the queen to save the people.",
 "Haman aveva decretato di distruggere gli ebrei. Mordechai chiese a Ester di andare dal re, forse era diventata regina proprio per questo.","Haman decreed to destroy the Jews. Mordecai asked Esther to go to the king, since maybe this was why she became queen."],
["מה","Che cosa si deve fare all'uomo che il re vuole onorare?","What should be done for the man the king wishes to honor?",
 "Nella notte in cui il re non riusciva a dormire.","On the night the king could not sleep.",
 "Il re voleva onorare Mordechai e chiese consiglio a Haman. Haman pensò che parlasse di lui, e alla fine dovette guidare Mordechai sul cavallo.","The king wanted to honor Mordecai and asked Haman. Haman thought it meant him, and ended up leading Mordecai on the horse."],
["קום","Alzati, va' a Ninive, la grande città.","Get up, go to Nineveh, the great city.",
 "Il profeta provò a fuggire su una nave.","The prophet tried to run away on a ship.",
 "Hashem mandò Giona ad avvertire Ninive. Giona fuggì verso Tarsis e finì nella pancia di un grande pesce.","Hashem sent Jonah to warn Nineveh. Jonah fled toward Tarshish and ended up inside a big fish."],
["הנה","Ecco il fuoco e la legna, ma dov'è l'agnello per l'offerta?","Here are the fire and the wood, but where is the lamb for the offering?",
 "Un figlio cammina con il padre verso il monte.","A son walks with his father toward the mountain.",
 "Sulla strada per il monte Moria, Isacco notò che c'erano fuoco e legna ma nessun agnello, e lo chiese al padre.","On the way to Mount Moriah, Isaac noticed fire and wood but no lamb, and asked his father."],
["מרגלים","Voi siete delle spie!","You are spies!",
 "Il vice del re d'Egitto riconosce gli ospiti, ma loro non riconoscono lui.","The viceroy of Egypt recognizes the visitors, but they do not recognize him.",
 "I fratelli scesero in Egitto a comprare cibo. Giuseppe li riconobbe, nascose chi era e li accusò di spionaggio per metterli alla prova.","The brothers came to Egypt to buy food. Joseph recognized them, hid who he was and accused them of spying to test them."],
["מה","Perché gridi verso di me?","Why do you cry out to Me?",
 "Davanti al Mar Rosso, con gli egiziani alle spalle.","Facing the Red Sea, with the Egyptians behind.",
 "Il popolo era intrappolato tra il mare e l'esercito egiziano. Hashem disse a Mosè che era il momento di andare avanti.","The people were trapped between the sea and Egypt's army. Hashem told Moses it was time to move forward."],
["קום","Alzati, facci un dio!","Get up, make us a god!",
 "Mosè tardava sul monte e loro aspettavano sotto.","Moses was late coming down the mountain, and they waited below.",
 "Quando Mosè non scendeva dal Sinai, il popolo chiese ad Aronne un nuovo dio. Così nacque il vitello d'oro.","When Moses did not come down from Sinai, the people asked Aaron for a new god. That is how the golden calf was made."],
["לא","Non è buona la cosa che stai facendo.","What you are doing is not good.",
 "Un suocero dà un buon consiglio al genero.","A father-in-law gives his son-in-law good advice.",
 "Ietro vide Mosè giudicare il popolo da solo dalla mattina alla sera e gli consigliò di nominare dei giudici.","Jethro saw Moses judging the people alone from morning to evening and advised him to appoint judges."],
["לכה","Vieni, ti prego, maledici per me questo popolo.","Come, please curse this people for me.",
 "Il re di Moav aveva paura dei figli d'Israele.","The king of Moab was afraid of the Israelites.",
 "Balak mandò messaggeri a Bil'am perché maledicesse Israele. Alla fine Bil'am li benedisse.","Balak sent messengers asking Balaam to curse Israel. In the end Balaam blessed them."],
["אם","Se verrai con me, andrò.","If you go with me, I will go.",
 "Un comandante chiede alla profetessa di unirsi alla battaglia.","A commander asks the prophetess to join the battle.",
 "La profetessa Debora disse a Barak di combattere contro Sisera. Barak accettò solo se lei fosse andata con lui.","Deborah the prophetess told Barak to fight Sisera. Barak agreed only if she came with him."],
["מהאכל","Da chi mangia è uscito il cibo, e dal forte è uscito il dolce.","Out of the eater came food, out of the strong came sweetness.",
 "Un indovinello che parla di un leone e del miele.","A riddle about a lion and honey.",
 "Sansone trovò del miele nel corpo di un leone. Al suo matrimonio propose l'indovinello agli ospiti filistei, che non riuscirono a risolverlo.","Samson found honey inside a lion's body. At his wedding he gave the riddle to the Philistine guests, who could not solve it."],
["מדוע","Perché sono stata gradita ai tuoi occhi?","Why have I found favor in your eyes?",
 "Spigolava nel campo di un uomo importante.","She gathered grain in the field of an important man.",
 "Boaz fu gentile con Rut e la lasciò spigolare nel suo campo. Rut fu sorpresa che trattasse così una straniera.","Boaz was kind to Ruth and let her gather in his field. Ruth was surprised he treated a foreigner this way."],
["לא","Non puoi andare contro questo Filisteo.","You cannot go against this Philistine.",
 "Il re pensa che un ragazzo sia troppo giovane per combattere il gigante.","The king thinks a boy is too young to fight the giant.",
 "Davide si offrì di combattere Golia. Saul disse che era solo un ragazzo, e Davide raccontò come aveva salvato le pecore da un leone e un orso.","David offered to fight Goliath. Saul said he was only a boy, and David told how he saved sheep from a lion and a bear."],
["עד","Fino a quando zoppicherete tra due opinioni?","How long will you jump between two opinions?",
 "Sul monte Carmelo, prima della prova del fuoco.","On Mount Carmel, before the test of fire.",
 "Elia chiese al popolo di decidere tra Hashem e Baal. Poi un fuoco scese dal cielo sul suo altare.","Elijah called on the people to choose between Hashem and Baal. Then fire came down from heaven onto his altar."],
["וכאשר","E se devo perire, perirò.","And if I perish, I perish.",
 "La regina decide di rischiare per il suo popolo.","The queen decides to take a risk for her people.",
 "Ester chiese che tutti gli ebrei digiunassero tre giorni e disse che sarebbe andata dal re anche se era pericoloso.","Esther asked all the Jews to fast for three days and said she would go to the king even though it was dangerous."],
["שאוני","Prendetemi e gettatemi in mare.","Pick me up and throw me into the sea.",
 "Una grande tempesta scuoteva la nave.","A great storm was shaking the ship.",
 "Giona capì che la tempesta era colpa sua e chiese ai marinai di gettarlo in mare perché si calmasse.","Jonah understood the storm was because of him and asked the sailors to throw him overboard so it would calm."],
["הנני","Eccomi, manda me!","Here I am, send me!",
 "Un profeta che ebbe la visione degli angeli nel Santuario.","A prophet who saw a vision of angels in the Temple.",
 "Hashem chiese chi dovesse mandare, e Isaia si offrì subito come messaggero.","Hashem asked whom He should send, and Isaiah volunteered right away."],
["אלהים","Dio stesso provvederà l'agnello per l'offerta, figlio mio.","God will provide the lamb for the offering, my son.",
 "La risposta di un padre alla domanda del figlio, sulla strada per il monte.","A father's answer to his son's question on the way to the mountain.",
 "Isacco chiese dove fosse l'agnello, e Abramo rispose che Dio avrebbe provveduto. Alla fine trovarono un montone impigliato in un cespuglio.","Isaac asked where the lamb was, and Abraham said God would provide. In the end they found a ram caught in a bush."],
["למה","Perché mi hai ingannato?","Why did you trick me?",
 "La mattina dopo il matrimonio ci fu una sorpresa.","The morning after the wedding there was a surprise.",
 "Giacobbe lavorò sette anni per Rachele, ma Lavan gli diede Lea. Giacobbe si arrabbiò per l'inganno.","Jacob worked seven years for Rachel, but Laban gave him Leah. Jacob was angry at the trick."],
["לא","Non ti lascerò andare finché non mi avrai benedetto.","I will not let you go unless you bless me.",
 "Una lotta durata tutta la notte, fino all'alba.","A struggle that lasted all night, until dawn.",
 "Giacobbe lottò con un angelo fino al mattino e non lo lasciò andare senza una benedizione. Da allora si chiamò Israele.","Jacob wrestled with an angel until morning and would not let go without a blessing. From then on he was called Israel."],
["אל","Non chiamatemi Naomi, chiamatemi Mara.","Do not call me Naomi, call me Mara.",
 "Una donna torna nella sua città dopo aver perso marito e figli.","A woman returns to her town after losing her husband and sons.",
 "Quando Naomi tornò a Betlemme, le donne chiesero se fosse lei. Lei chiese di chiamarla Mara, «amara», perché la sua vita era diventata amara.","When Naomi returned to Bethlehem, the women asked if it was her. She asked to be called Mara, “bitter”, because her life had turned bitter."],
["עד","Fino a quando resterai ubriaca?","How long will you be drunk?",
 "Un sacerdote vide una donna muovere le labbra senza che si sentisse la voce.","A priest saw a woman moving her lips with no sound.",
 "Anna pregava in silenzio per avere un figlio. Il sacerdote Eli pensò che fosse ubriaca, poi capì che pregava e la benedisse.","Hannah prayed silently for a son. Eli the priest thought she was drunk, then realized she was praying and blessed her."],
["הנה","Ecco, ubbidire è meglio di un sacrificio.","To obey is better than a sacrifice.",
 "Un profeta rimprovera il re che non ha fatto ciò che gli era stato ordinato.","A prophet scolds the king for not doing what he was told.",
 "Saul non distrusse Amalek come ordinato e disse di aver tenuto il bestiame per i sacrifici. Samuele gli rispose che ascoltare Hashem conta di più.","Saul did not destroy Amalek as commanded and said he kept animals for sacrifices. Samuel told him that obeying Hashem matters more."],
["האתה","Sei tu quello che porta guai a Israele?","Is that you, the troublemaker of Israel?",
 "Un re incontra un profeta dopo tre anni di siccità.","A king meets a prophet after three years of drought.",
 "Achab accusò Elia della siccità. Elia rispose che il vero problema era che Achab adorava Baal.","Ahab blamed Elijah for the drought. Elijah answered that the real problem was Ahab worshipping Baal."],
["מה","Che cosa fai qui, Elia?","What are you doing here, Elijah?",
 "In una grotta sul monte Horev, dopo la fuga da una regina arrabbiata.","In a cave on Mount Horeb, after fleeing an angry queen.",
 "Elia fuggì da Jezebel nel deserto e arrivò al monte Horev. Lì Hashem gli chiese cosa facesse e gli apparve in una voce sottile di silenzio.","Elijah fled Jezebel into the desert and reached Mount Horeb. There Hashem asked what he was doing and came to him in a still, small voice."],
["ויהי","Che io abbia, ti prego, il doppio del tuo spirito.","Please let a double portion of your spirit be upon me.",
 "Un allievo fa una richiesta un attimo prima che il suo maestro salga al cielo in una tempesta.","A student makes a request just before his teacher rises to heaven in a storm.",
 "Prima di salire al cielo, Elia chiese a Eliseo cosa potesse fare per lui. Eliseo chiese il doppio del suo spirito.","Before rising to heaven, Elijah asked Elisha what he could do for him. Elisha asked for a double portion of his spirit."],
["ההיטב","Fai bene ad arrabbiarti così?","Is it right for you to be so angry?",
 "Un profeta si arrabbiò perché la grande città fu salvata.","A prophet was angry that the great city was saved.",
 "Gli abitanti di Ninive si pentirono e Hashem li perdonò. Giona si arrabbiò, e Hashem gli chiese se fosse giusto arrabbiarsi.","The people of Nineveh repented and Hashem forgave them. Jonah was angry, and Hashem asked if his anger was right."],
["השפט","Il giudice di tutta la terra non farà giustizia?","Shall the Judge of all the earth not do justice?",
 "Una discussione coraggiosa sul destino di Sodoma.","A brave argument about the fate of Sodom.",
 "Hashem disse ad Abramo che Sodoma sarebbe stata distrutta. Abramo pregò per la città e chiese che i giusti non fossero puniti con i malvagi.","Hashem told Abraham that Sodom would be destroyed. Abraham prayed for the city and asked that the good not be punished with the wicked."],
["אל","Non dire: sono solo un ragazzo.","Do not say, I am only a boy.",
 "Un giovane profeta pensava di essere troppo giovane per parlare.","A young prophet thought he was too young to speak.",
 "Geremia disse di non saper parlare perché era giovane. Hashem gli disse di non avere paura, perché sarebbe stato con lui.","Jeremiah said he could not speak because he was young. Hashem told him not to be afraid, because He would be with him."]
];

, {"v": "שְׁאַל אָבִיךָ וְיַגֵּדְךָ זְקֵנֶיךָ וְיֹאמְרוּ לָךְ", "src": "דברים ל״ב, ז׳", "who": "משה", "to": "העם", "whoX": ["אהרן", "יהושע", "ה׳"], "toX": ["יהושע", "הכהנים", "הזקנים"], "lvl": 3, "hint": "בשירה, עצה לשאול את הדורות הקודמים.", "ctx": "בשירת האזינו משה אמר לעם לשאול את ההורים והזקנים, כדי לזכור את מה שה׳ עשה בעבר."}, {"v": "שִׂימוּ לְבַבְכֶם לְכָל הַדְּבָרִים אֲשֶׁר אָנֹכִי מֵעִיד בָּכֶם הַיּוֹם", "src": "דברים ל״ב, מ״ו", "who": "משה", "to": "העם", "whoX": ["אהרן", "יהושע", "ה׳"], "toX": ["יהושע", "אהרן", "הכהנים"], "lvl": 3, "hint": "אחרי שסיים לומר את השירה כולה.", "ctx": "משה סיים את השירה וביקש מהעם לשים לב לכל הדברים וללמד אותם את ילדיהם."}, {"v": "עֲלֵה אֶל הַר הָעֲבָרִים הַזֶּה הַר נְבוֹ", "src": "דברים ל״ב, מ״ט", "who": "ה׳", "to": "משה", "whoX": ["המלאך", "אהרן", "יהושע"], "toX": ["יהושע", "אהרן", "כלב"], "lvl": 2, "hint": "הר שממנו אפשר לראות את הארץ מרחוק.", "ctx": "ה׳ אמר למשה לעלות על הר נבו, לראות משם את ארץ כנען, ושם הוא ימות."}, {"v": "אֵין כָּאֵל יְשֻׁרוּן", "src": "דברים ל״ג, כ״ו", "who": "משה", "to": "העם", "whoX": ["אהרן", "יהושע", "יעקב"], "toX": ["יהושע", "הכהנים", "אהרן"], "lvl": 3, "hint": "בברכה האחרונה, שם מיוחד לעם ישראל.", "ctx": "בסוף ברכותיו לשבטים, משה אמר שאין כאל של ישורון — שם חיבה לעם ישראל."}, {"v": "אַשְׁרֶיךָ יִשְׂרָאֵל מִי כָמוֹךָ עַם נוֹשַׁע בַּה׳", "src": "דברים ל״ג, כ״ט", "who": "משה", "to": "העם", "whoX": ["אהרן", "בלעם", "יהושע"], "toX": ["יהושע", "אהרן", "הכהנים"], "lvl": 2, "hint": "המילים האחרונות של המנהיג הגדול לעם.", "ctx": "אלה הדברים האחרונים שמשה אמר לפני מותו: כמה מאושר עם ישראל שה׳ מושיע אותו."}, {"v": "זֹאת הָאָרֶץ אֲשֶׁר נִשְׁבַּעְתִּי לְאַבְרָהָם לְיִצְחָק וּלְיַעֲקֹב", "src": "דברים ל״ד, ד׳", "who": "ה׳", "to": "משה", "whoX": ["המלאך", "אהרן", "יהושע"], "toX": ["יהושע", "אהרן", "העם"], "lvl": 2, "hint": "מראש הפסגה רואים את כל הארץ.", "ctx": "מראש הר נבו ה׳ הראה למשה את כל הארץ שהבטיח לאבות, ושם משה נפטר."}]);
TR.push(...[["בֹּא", "Entra tu e tutta la tua famiglia nell'arca", "Come, you and all your household, into the ark", "L'arca è pronta e la pioggia sta per cominciare.", "The ark is ready and the rain is about to begin.", "Noè costruì l'arca come gli era stato ordinato. Hashem gli disse di entrarvi con tutta la famiglia prima del diluvio.", "Noah built the ark as he was told. Hashem told him to go in with his whole family before the flood."], ["צֵא", "Esci dall'arca, tu, tua moglie, i tuoi figli e le mogli dei tuoi figli", "Go out of the ark, you and your wife, your sons and your sons' wives", "Le acque si sono asciugate e la terra è di nuovo pronta.", "The waters have dried and the land is ready again.", "Finito il diluvio e asciugata la terra, Hashem disse a Noè di uscire dall'arca con la famiglia e con tutti gli animali.", "After the flood ended and the earth dried, Hashem told Noah to leave the ark with his family and all the animals."], ["אֶת", "Ho posto il mio arco nella nube: sarà il segno del patto", "I have set My bow in the cloud, and it shall be a sign of the covenant", "Un segno colorato nel cielo dopo la pioggia.", "A colorful sign in the sky after the rain.", "Hashem promise a Noè che non avrebbe più mandato un diluvio su tutta la terra: l'arcobaleno è il segno di questa promessa.", "Hashem promised Noah never again to bring a flood on the whole earth, and the rainbow is the sign of that promise."], ["אַל", "Non vi sia contesa tra me e te, tra i miei pastori e i tuoi, perché siamo fratelli", "Let there be no quarrel between me and you, and between my herdsmen and yours, for we are kinsmen", "I pastori di due parenti litigavano per i pascoli.", "The shepherds of two relatives were fighting over pasture.", "I pastori di Abram e di Lot non avevano abbastanza spazio. Per mantenere la pace, Abram lasciò scegliere a Lot dove andare.", "Abram's and Lot's shepherds didn't have enough room. To keep the peace, Abram let Lot choose where to go."], ["אַל", "Non temere, Abram: io sono il tuo scudo", "Do not fear, Abram; I am your shield", "Dopo la grande guerra, la parola di Hashem arriva in una visione.", "After the great war, Hashem's word comes in a vision.", "Dopo aver sconfitto i re, Abram temeva il futuro. Hashem lo rassicurò che lo avrebbe protetto.", "After Abram defeated the kings, he worried about what would come. Hashem reassured him that He would protect him."], ["הָגָר", "Agar, serva di Sarai, da dove vieni e dove vai?", "Hagar, Sarai's maid, where have you come from and where are you going?", "Vicino a una sorgente nel deserto, sulla via di Shur.", "By a spring of water in the desert, on the road to Shur.", "Agar fuggì da Sarai nel deserto. Un angelo la trovò presso una sorgente e le chiese da dove venisse e dove andasse.", "Hagar ran away from Sarai into the desert. An angel found her by a spring and asked where she came from and where she was going."], ["הֲיִפָּלֵא", "C'è forse qualcosa di troppo difficile per Hashem?", "Is anything too wondrous for Hashem?", "Qualcuno ride nella tenda sentendo che avrà un figlio da anziana.", "Someone laughed in the tent on hearing she would have a son in old age.", "Sara rise sentendo che avrebbe avuto un figlio nonostante l'età. Hashem chiese ad Abramo se esista qualcosa di troppo difficile per Lui.", "Sarah laughed when she heard she'd have a son despite her age. Hashem asked Abraham whether anything is too hard for Him."], ["גָּרֵשׁ", "Caccia questa serva e suo figlio", "Drive out this maidservant and her son", "Una madre si preoccupa per il suo figlio piccolo Isacco.", "A mother worries about her young son Isaac.", "Sara vide che Ismaele aveva una cattiva influenza su Isacco e chiese ad Abramo di mandare via Agar e suo figlio.", "Sarah saw that Ishmael was a bad influence on Isaac and asked Abraham to send Hagar and her son away."], ["נְשִׂיא", "Tu sei un principe di Dio in mezzo a noi", "You are a prince of God among us", "La gente di Hebron parla con chi vuole comprare una grotta.", "The people of Hebron speak with someone who wants to buy a cave.", "Abramo voleva comprare un luogo dove seppellire Sara. Gli abitanti lo onorarono molto, dicendo che era come un principe tra loro.", "Abraham asked to buy a place to bury Sarah. The townspeople honored him greatly, saying he was like a prince among them."], ["כִּי", "Andrai nella mia terra, dalla mia famiglia, e prenderai una moglie per mio figlio Isacco", "Go to my land and my birthplace, and take a wife for my son Isaac", "Un padre anziano manda un servo fidato a trovare una sposa per il figlio.", "An old father sends a trusted servant to find a bride for his son.", "Abramo voleva che Isacco sposasse una donna della sua famiglia e mandò il servo fidato nella sua terra d'origine.", "Abraham wanted Isaac to marry a woman from his family, and sent his loyal servant back to his homeland."], ["שְׁתֵה", "Bevi, mio signore", "Drink, my lord", "Vicino al pozzo, una ragazza generosa abbassa la brocca.", "At the well, a kind girl lowers her jug.", "Il servo di Abramo chiese un segno: la ragazza che avrebbe offerto acqua a lui e ai cammelli. Rebecca lo fece.", "Abraham's servant asked for a sign: the girl who would offer water to him and his camels. Rebecca did just that."], ["מִי", "Chi è quell'uomo che cammina nel campo verso di noi?", "Who is that man walking in the field toward us?", "Alla fine di un lungo viaggio in cammello, qualcuno si avvicina nel campo.", "At the end of a long camel ride, someone approaches in the field.", "Arrivata in Canaan, Rebecca vide un uomo nel campo e chiese chi fosse. Il servo rispose che era Isacco, il suo padrone.", "Arriving in Canaan, Rebecca saw a man in the field and asked who he was. The servant answered that it was Isaac, his master."], ["הִנֵּה", "Sto per morire: a che mi serve la primogenitura?", "I am about to die; what use is the birthright to me?", "Un cacciatore affamato rinuncia a qualcosa di importante per un piatto di cibo.", "A hungry hunter gives up something important for a bowl of food.", "Esaù tornò stanco dai campi. Giacobbe chiese la primogenitura in cambio della minestra di lenticchie ed Esaù accettò.", "Esau came home exhausted. Jacob asked for the birthright in exchange for lentil stew, and Esau agreed."], ["עָלַי", "Su di me la tua maledizione, figlio mio; ascolta soltanto la mia voce", "Upon me be your curse, my son; just listen to my voice", "Una madre incoraggia il figlio a ricevere la benedizione del padre.", "A mother urges her son to receive his father's blessing.", "Giacobbe temeva di essere scoperto e maledetto. Rebecca si prese la responsabilità e gli chiese di ascoltarla.", "Jacob feared being found out and cursed. Rebecca took the responsibility upon herself and asked him to listen to her."], ["הַקֹּל", "La voce è la voce di Giacobbe, ma le mani sono le mani di Esaù", "The voice is the voice of Jacob, but the hands are the hands of Esau", "Un padre che non vede tocca delle mani pelose.", "A father who cannot see feels hairy hands.", "Isacco era cieco. Giacobbe si travestì da Esaù con pelli di capretto, ma Isacco riconobbe la sua voce.", "Isaac was blind. Jacob disguised himself as Esau with goatskins, but Isaac recognized his voice."], ["בָּרְכֵנִי", "Benedici anche me, padre mio!", "Bless me too, my father!", "Un cacciatore torna e scopre che la benedizione è già stata data.", "A hunter comes back and finds the blessing already given.", "Esaù tornò con il cibo e scoprì che Giacobbe aveva già ricevuto la benedizione. Gridò piangendo e ne chiese una anche per sé.", "Esau returned with the food and found Jacob had already been blessed. He cried out and begged for a blessing too."], ["אֶעֱבָדְךָ", "Ti servirò sette anni per Rachele, tua figlia minore", "I will serve you seven years for Rachel, your younger daughter", "Un pastore innamorato si offre di lavorare per molti anni.", "A shepherd in love offers to work for many years.", "Giacobbe amava Rachele e propose a Lavan di lavorare sette anni per sposarla. Gli sembrarono pochi giorni.", "Jacob loved Rachel and offered to work seven years for Laban to marry her. They seemed to him like just a few days."], ["הַבָּנוֹת", "Le figlie sono mie figlie, i figli sono miei figli e il gregge è il mio gregge", "The daughters are my daughters, the sons are my sons, the flocks are my flocks", "Dopo un inseguimento sui monti di Gilad, un nonno è arrabbiato.", "After a chase in the hills of Gilead, a grandfather is angry.", "Giacobbe fuggì da Lavan con la famiglia. Lavan lo inseguì sostenendo che tutto era suo; alla fine fecero un patto di pace.", "Jacob fled from Laban with his family. Laban chased him, claiming it was all his; in the end they made a peace treaty."], ["לֹא", "Il tuo nome non sarà più Giacobbe, ma Israele", "Your name shall no longer be Jacob, but Israel", "Alla fine di una lotta notturna arriva un nome nuovo.", "At the end of a night-long struggle comes a new name.", "Dopo che Giacobbe lottò tutta la notte senza arrendersi, l'angelo gli diede un nome nuovo: Israele.", "After Jacob wrestled all night without giving up, the angel gave him a new name: Israel."], ["מִי", "Chi sono questi che hai con te?", "Who are these with you?", "Un fratello, dopo molti anni, vede avvicinarsi una grande famiglia.", "After many years, a brother sees a big family approaching.", "Esaù incontrò Giacobbe dopo vent'anni e vide molte donne e bambini. Giacobbe rispose che erano i figli donatigli da Dio.", "Esau met Jacob after twenty years and saw many wives and children. Jacob said they were the children God had given him."], ["יֶשׁ", "Ho abbastanza, fratello mio: tieni ciò che è tuo", "I have plenty, my brother; let what is yours remain yours", "Un fratello all'inizio rifiuta un grande dono di greggi.", "A brother at first refuses a big gift of flocks.", "Giacobbe mandò a Esaù un grande dono di animali. Esaù disse di averne abbastanza, ma alla fine lo accettò.", "Jacob sent Esau a big gift of animals. Esau said he had enough, but accepted it in the end when Jacob insisted."], ["שִׁמְעוּ", "Ascoltate il sogno che ho fatto", "Please listen to this dream that I dreamed", "Un sogno di covoni nel campo che si inchinano.", "A dream about sheaves in a field that bow down.", "Giuseppe sognò che i covoni dei fratelli si inchinavano al suo. Quando lo raccontò, lo odiarono ancora di più.", "Joseph dreamed his brothers' sheaves bowed to his. When he told them, they hated him even more."], ["אֶת", "Sto cercando i miei fratelli", "I am looking for my brothers", "Un ragazzo si è perso in un campo vicino a Shechem.", "A boy is lost in a field near Shechem.", "Giacobbe mandò Giuseppe a vedere come stessero i fratelli. Giuseppe si perse e un uomo gli indicò che erano andati a Dotan.", "Jacob sent Joseph to check on his brothers. Joseph got lost, and a man he met told him they had gone to Dothan."], ["אַל", "Non spargete sangue", "Do not shed blood", "Il fratello maggiore cerca di salvare suo fratello.", "The eldest brother tries to save his brother.", "I fratelli volevano uccidere Giuseppe. Ruben propose di gettarlo in un pozzo, pensando di tornare a salvarlo.", "The brothers wanted to kill Joseph. Reuben suggested throwing him into a pit, planning to come back and rescue him."], ["מַה", "Che guadagno avremo a uccidere nostro fratello?", "What do we gain if we kill our brother?", "Arriva una carovana di mercanti e un fratello ha un'idea.", "A caravan of merchants approaches, and one brother has an idea.", "Vedendo una carovana di Ismaeliti, Giuda propose di non uccidere Giuseppe ma di venderlo.", "Seeing a caravan of Ishmaelites, Judah suggested not killing Joseph but selling him."], ["בִּלְעָדָי", "Non io: sarà Dio a dare una risposta di pace al Faraone", "It is not in me; God will give Pharaoh an answer of peace", "Un prigioniero, appena uscito dalla fossa, sta davanti al re.", "A prisoner, just brought out of the pit, stands before the king.", "Il Faraone disse a Giuseppe di aver sentito che sapeva interpretare i sogni. Giuseppe rispose umilmente che sarebbe stato Dio a farlo.", "Pharaoh said he'd heard Joseph could interpret dreams. Joseph humbly answered that God, not he, would do it."], ["אֵין", "Non c'è nessuno intelligente e saggio come te", "There is no one as discerning and wise as you", "Il re è colpito dall'interpretazione dei sogni e dal consiglio.", "The king is impressed by the dream solution and the advice.", "Dopo che Giuseppe interpretò i sogni e propose un piano, il Faraone lo nominò viceré di tutto l'Egitto.", "After Joseph interpreted the dreams and proposed a plan, Pharaoh made him second-in-command of all Egypt."], ["אֹתִי", "Mi avete privato dei figli: Giuseppe non c'è più e Simeone non c'è più", "You have bereaved me: Joseph is gone and Simeon is gone", "Un padre ha paura di mandare in Egitto il figlio più giovane.", "A father is afraid to send his youngest son to Egypt.", "I fratelli tornarono senza Simeone e chiesero di portare Beniamino. Giacobbe rifiutò per paura di perdere un altro figlio.", "The brothers came back without Simeon and asked to take Benjamin. Jacob refused, afraid of losing another son."], ["אָנֹכִי", "Io ne sarò garante: chiedine conto a me", "I will be his guarantor; from my hand you may demand him", "Un fratello si prende piena responsabilità per il più piccolo.", "A brother takes full responsibility for the youngest.", "La carestia continuava e bisognava tornare in Egitto con Beniamino. Giuda promise al padre di esserne garante.", "The famine went on and they had to return to Egypt with Benjamin. Judah promised his father he would be responsible for him."], ["יֵשֶׁב", "Lascia che il tuo servo resti schiavo del mio signore al posto del ragazzo", "Let your servant remain as a slave to my lord instead of the boy", "Un fratello si offre come schiavo al posto del più piccolo.", "A brother offers to be a slave in place of the youngest.", "La coppa fu trovata a Beniamino. Giuda si avvicinò al viceré e propose di restare schiavo al suo posto.", "The goblet was found with Benjamin. Judah approached the viceroy and offered to stay as a slave in his place."], ["כִּי", "Dio mi ha mandato qui prima di voi per salvare delle vite", "God sent me ahead of you to preserve life", "Un fratello consola i fratelli che si vergognano di ciò che hanno fatto.", "A brother comforts his brothers, who are ashamed of what they did.", "Quando Giuseppe si rivelò, i fratelli ebbero paura. Disse loro di non rattristarsi: Dio lo aveva mandato per salvare vite.", "When Joseph revealed himself, his brothers were terrified. He told them not to be sad: God sent him to save lives."], ["אַל", "Non temere di scendere in Egitto", "Do not be afraid to go down to Egypt", "A Beer Sheva, in una visione notturna, prima di un grande viaggio verso sud.", "In Beersheba, in a night vision, before a long journey south.", "Giacobbe temeva di scendere in Egitto. Hashem gli disse di non avere paura, perché lì lo avrebbe reso un grande popolo.", "Jacob was afraid to go down to Egypt. Hashem told him not to fear, for He would make him a great nation there."], ["כַּמָּה", "Quanti sono gli anni della tua vita?", "How many are the days of the years of your life?", "Un re incontra un nonno molto anziano.", "A king meets a very old grandfather.", "Giuseppe portò il padre davanti al Faraone, che chiese a Giacobbe quanti anni avesse: centotrenta.", "Joseph brought his father before Pharaoh, who asked Jacob his age. Jacob answered one hundred and thirty."], ["רְאֹה", "Non pensavo di rivedere il tuo volto", "I never expected to see your face", "Un nonno si emoziona nell'incontrare i nipoti.", "A grandfather is moved to meet his grandsons.", "Giacobbe pensava che non avrebbe mai più visto Giuseppe, e ora vedeva perfino i suoi figli.", "Jacob thought he'd never see Joseph again, and now he even got to see his children."], ["יְשִׂמְךָ", "Dio ti renda come Efraim e Menashe", "May God make you like Ephraim and Manasseh", "Una benedizione che i genitori danno ancora oggi ai figli.", "A blessing parents still give their children today.", "Giacobbe benedisse i due figli di Giuseppe e disse che Israele avrebbe benedetto i propri figli perché fossero come loro.", "Jacob blessed Joseph's two sons and said Israel would bless their children to be like them."], ["יְהוּדָה", "Giuda, te loderanno i tuoi fratelli", "Judah, your brothers shall praise you", "Prima di morire, un padre benedice ciascuno dei figli.", "Before he dies, a father blesses each of his sons.", "Giacobbe benedisse i figli prima di morire. A Giuda disse che i fratelli lo avrebbero onorato e che da lui sarebbe venuto il regno.", "Jacob blessed his sons before his death. He told Judah his brothers would honor him and kingship would come from him."], ["אַל", "Non temete: sono forse io al posto di Dio?", "Do not be afraid; am I in place of God?", "Dopo la morte del padre, i fratelli temono una vendetta.", "After their father's death, the brothers fear revenge.", "Dopo la morte di Giacobbe, i fratelli temevano la vendetta di Giuseppe. Lui li rassicurò e promise di prendersi cura di loro.", "After Jacob died, the brothers feared Joseph's revenge. He reassured them and promised to take care of them."], ["הַאֵלֵךְ", "Devo andare a chiamarti una nutrice tra le donne ebree?", "Shall I go and call you a nurse from the Hebrew women?", "Una sorella maggiore si nasconde vicino al Nilo e sorveglia una cesta.", "A big sister hides by the Nile, watching over a basket.", "La figlia del Faraone trovò il bambino nella cesta. La sorella, che guardava da lontano, si offrì di chiamare una nutrice: la madre stessa!", "Pharaoh's daughter found the baby in the basket. His sister, watching from afar, offered to call a nurse, who was actually his mother."], ["וְהוֹצֵאתִי", "Vi farò uscire da sotto i pesi dell'Egitto", "I will bring you out from under the burdens of Egypt", "Una promessa che ricordiamo al Seder, con il primo bicchiere.", "A promise we recall at the Seder, with the first cup.", "Mosè era scoraggiato perché la situazione era peggiorata. Hashem gli rinnovò la promessa di liberare Israele dall'Egitto.", "Moses was discouraged because things got worse. Hashem renewed His promise to redeem Israel from Egypt."], ["רְאֵה", "Vedi, ti ho posto come un dio per il Faraone, e tuo fratello Aronne sarà il tuo profeta", "See, I have made you as God to Pharaoh, and Aaron your brother shall be your prophet", "Chi parla spiega a chi è impacciato nel parlare come rivolgersi al re.", "The speaker explains to someone who struggles to speak how to address the king.", "Mosè disse di essere impacciato nel parlare. Hashem gli rispose che Aronne avrebbe parlato al posto suo.", "Moses said he was slow of speech. Hashem told him Aaron his brother would speak for him."], ["אֶצְבַּע", "È il dito di Dio!", "It is the finger of God!", "I maghi non riuscirono a imitare la piaga dei pidocchi.", "The magicians could not copy the plague of lice.", "Nelle prime piaghe i maghi imitarono Mosè. Con i pidocchi non ci riuscirono, e ammisero che era la potenza di Dio.", "In the first plagues the magicians copied Moses. With the lice they failed, and admitted it was God's power."], ["חָטָאתִי", "Questa volta ho peccato: Hashem è giusto, io e il mio popolo siamo colpevoli", "This time I have sinned; Hashem is righteous, and I and my people are wicked", "Durante la grandine, un re per un momento ammette la colpa.", "During the hail, a king admits his fault for a moment.", "La grandine distrusse l'Egitto e il Faraone ammise di aver peccato. Ma appena smise, indurì di nuovo il cuore.", "The hail destroyed Egypt and Pharaoh admitted his sin. But once it stopped, he hardened his heart again."], ["הֲטֶרֶם", "Non capisci ancora che l'Egitto è rovinato?", "Do you not yet know that Egypt is lost?", "I consiglieri del re perdono la pazienza prima delle locuste.", "The king's advisors lose patience before the locusts.", "Prima delle locuste, i servi del Faraone gli chiesero di lasciar partire il popolo: l'Egitto era già distrutto.", "Before the locusts, Pharaoh's servants begged him to let the people go, since Egypt was already ruined."], ["בִּנְעָרֵינוּ", "Andremo con i nostri giovani e con i nostri vecchi", "We will go with our young and with our old", "Il re chiede chi andrà esattamente a festeggiare nel deserto.", "The king asks who exactly will go to celebrate in the desert.", "Il Faraone voleva che andassero solo gli uomini. Mosè insistette: tutto il popolo, giovani e anziani, figli e figlie.", "Pharaoh wanted only the men to go. Moses insisted the whole people would go, young and old, sons and daughters."], ["הַחֹדֶשׁ", "Questo mese sarà per voi il primo dei mesi", "This month shall be for you the beginning of months", "Il primo precetto dato al popolo d'Israele, ancora in Egitto.", "The first commandment given to Israel, while still in Egypt.", "Prima dell'uscita dall'Egitto, Hashem diede il precetto di santificare i mesi e stabilì Nisan come primo mese.", "Before the Exodus, Hashem gave the commandment to sanctify the months and set Nisan as the first."], ["קוּמוּ", "Alzatevi, uscite di mezzo al mio popolo!", "Rise up, go out from among my people!", "A mezzanotte, dopo la decima piaga.", "At midnight, after the tenth plague.", "Dopo la piaga dei primogeniti, il Faraone chiamò Mosè e Aronne nel cuore della notte e disse loro di partire subito.", "After the plague of the firstborn, Pharaoh called Moses and Aaron in the middle of the night and told them to leave at once."], ["הֲמִבְּלִי", "Non c'erano forse tombe in Egitto?", "Were there no graves in Egypt?", "Il mare davanti e l'esercito egiziano dietro.", "The sea in front, the Egyptian army behind.", "Gli Israeliti videro gli Egiziani inseguirli ed ebbero paura. Si lamentarono con Mosè per averli fatti uscire dall'Egitto.", "The Israelites saw the Egyptians chasing them and panicked. They complained to Moses for taking them out of Egypt."], ["אַל", "Non temete! State saldi e vedrete la salvezza di Hashem", "Do not fear! Stand firm and see the salvation of Hashem", "Un capo tranquillizza un popolo spaventato vicino al Mar Rosso.", "A leader calms a frightened people by the Sea of Reeds.", "Quando il popolo si spaventò per gli Egiziani, Mosè lo tranquillizzò dicendo che Hashem avrebbe combattuto per loro.", "When the people panicked at the Egyptians, Moses calmed them, saying Hashem would fight for them."], ["הוּא", "È il pane che Hashem vi ha dato da mangiare", "It is the bread that Hashem has given you to eat", "Al mattino trovano a terra qualcosa di bianco e sottile.", "In the morning they find something thin and white on the ground.", "Nel deserto non c'era cibo. Al mattino scese la manna e il popolo non sapeva cosa fosse. Mosè spiegò che era pane da Hashem.", "There was no food in the desert. In the morning manna fell and the people didn't know what it was. Moses explained it was bread from Hashem."], ["בְּחַר", "Scegli per noi degli uomini ed esci a combattere contro Amalek", "Choose men for us and go out to fight Amalek", "Un nemico attacca il popolo a Refidim.", "An enemy attacks the people at Rephidim.", "Amalek attaccò Israele. Mosè mandò Giosuè a combattere, mentre lui salì sulla collina con le mani alzate.", "Amalek attacked Israel. Moses sent Joshua to fight, while he went up the hill and raised his hands."], ["עַתָּה", "Ora so che Hashem è più grande di tutti gli dèi", "Now I know that Hashem is greater than all gods", "Un suocero venuto da lontano sente parlare di tutti i miracoli.", "A father-in-law who came from afar hears about all the miracles.", "Ietro raggiunse Mosè nel deserto, sentì dell'uscita dall'Egitto e della divisione del mare, e lodò la grandezza di Hashem.", "Jethro came to Moses in the desert, heard about the Exodus and the splitting of the sea, and praised Hashem's greatness."], ["כֹּל", "Tutto ciò che Hashem ha detto, lo faremo", "All that Hashem has spoken, we will do", "Tutto il popolo risponde insieme, come un solo uomo, prima del dono della Torah.", "The whole people answered together, as one, before the giving of the Torah.", "Prima del dono della Torah, Mosè chiese al popolo se l'avrebbe accettata. Tutti risposero insieme che avrebbero fatto ciò che Hashem diceva.", "Before the giving of the Torah, Moses asked the people if they would accept it. All answered together that they would do all Hashem said."], ["אָנֹכִי", "Io sono Hashem, il tuo Dio, che ti ho fatto uscire dalla terra d'Egitto", "I am Hashem your God, who brought you out of the land of Egypt", "La prima delle Dieci Parole.", "The first of the Ten Commandments.", "Sul monte Sinai, tra fuoco e tuoni, Hashem parlò a tutto il popolo e diede i Dieci Comandamenti.", "At Mount Sinai, amid fire and thunder, Hashem spoke to the whole people and gave the Ten Commandments."], ["דַּבֵּר", "Parla tu con noi e noi ascolteremo", "You speak with us, and we will listen", "Dopo tuoni e lampi, il popolo ha paura.", "After the thunder and lightning, the people are afraid.", "Il popolo sentì i tuoni e vide le fiamme ed ebbe molta paura. Chiese che fosse Mosè a parlare con loro.", "The people heard the thunder and saw the flames and were very afraid. They asked Moses to speak with them instead."], ["כֹּל", "Tutto ciò che Hashem ha detto, lo faremo e lo ascolteremo", "All that Hashem has spoken we will do, and we will hear", "Due parole famose: prima si fa, poi si ascolta.", "Two famous words: first we do, then we understand.", "Mosè lesse al popolo il Libro del Patto. Il popolo rispose «faremo e ascolteremo», impegnandosi prima ancora di capire tutto.", "Moses read the Book of the Covenant to the people. They answered “we will do and we will hear”, committing even before understanding everything."], ["עֲלֵה", "Sali da me sul monte e resta lì", "Come up to Me on the mountain and be there", "Un invito a salire sul monte e ricevere le tavole di pietra.", "An invitation to climb the mountain and receive tablets of stone.", "Hashem chiamò Mosè a salire sul monte per ricevere le tavole di pietra. Mosè vi rimase quaranta giorni e quaranta notti.", "Hashem called Moses up the mountain to receive the stone tablets. Moses stayed there forty days and forty nights."], ["שְׁבוּ", "Aspettateci qui finché torneremo da voi", "Wait here for us until we return to you", "Prima di salire sul monte, un capo lascia istruzioni.", "Before going up the mountain, a leader leaves instructions.", "Mosè salì sul monte con Giosuè e chiese agli anziani di aspettare, lasciando con loro Aronne e Cur.", "Moses went up with Joshua and asked the elders to wait, leaving Aaron and Hur with them."], ["דַּבֵּר", "Di' ai figli d'Israele che mi portino un'offerta", "Speak to the Children of Israel, that they bring Me an offering", "L'inizio della costruzione del Tabernacolo: ognuno dona secondo il suo cuore.", "The start of building the Mishkan: everyone gives as their heart moves them.", "Hashem chiese che chiunque avesse un cuore generoso portasse un'offerta per il Tabernacolo: oro, argento, rame e altro.", "Hashem asked that anyone with a generous heart bring a gift for the Mishkan: gold, silver, copper and more."], ["וְעָשׂוּ", "Mi facciano un santuario e io abiterò in mezzo a loro", "Let them make Me a sanctuary, and I will dwell among them", "Hashem vuole abitare in mezzo al popolo.", "Hashem wants to dwell among the people.", "Hashem disse di costruirgli un santuario, e che avrebbe abitato in mezzo a Israele: non solo nell'edificio, ma in ciascuno di loro.", "Hashem asked for a sanctuary and said He would dwell among Israel, not only in the building but within each of them."], ["וְנוֹעַדְתִּי", "Lì mi incontrerò con te e ti parlerò da sopra il coperchio", "There I will meet with you and speak with you from above the cover", "Sopra l'Arca del Patto, tra i due cherubini.", "Above the Ark of the Covenant, between the two cherubs.", "Hashem disse a Mosè che gli avrebbe parlato tra i due cherubini posti sull'Arca del Patto.", "Hashem told Moses He would speak to him from between the two cherubs on the Ark."], ["וְאַתָּה", "Ordina ai figli d'Israele di portarti olio d'oliva puro", "Command the Children of Israel to bring you pure olive oil", "Olio puro per una luce che arde sempre.", "Pure oil for a light that always burns.", "Hashem ordinò di portare olio d'oliva puro per accendere ogni sera la Menorah nel Tabernacolo.", "Hashem commanded them to bring pure olive oil to light the Menorah in the Mishkan every evening."], ["וְאַתָּה", "Fa' avvicinare a te tuo fratello Aronne", "Bring near to you Aaron your brother", "La scelta del primo Sommo Sacerdote.", "The choosing of the first High Priest.", "Hashem disse a Mosè che suo fratello Aronne e i suoi figli sarebbero stati sacerdoti nel Tabernacolo, e descrisse i loro abiti speciali.", "Hashem told Moses that Aaron and his sons would be priests in the Mishkan, and described their special garments."], ["וְשָׁכַנְתִּי", "Abiterò in mezzo ai figli d'Israele e sarò il loro Dio", "I will dwell among the Children of Israel and be their God", "Lo scopo di tutto il Tabernacolo, in una frase.", "The purpose of the whole Mishkan, in one sentence.", "Alla fine delle istruzioni per i sacerdoti, Hashem disse che grazie al Tabernacolo avrebbe abitato in mezzo a Israele.", "At the end of the priests' consecration, Hashem said that through the Mishkan He would dwell among Israel."], ["מֶה", "Che cosa ti ha fatto questo popolo?", "What did this people do to you?", "Un fratello torna dal monte e trova un vitello d'oro.", "A brother comes down the mountain and finds a golden calf.", "Mosè scese dal monte e vide il vitello d'oro. Chiese ad Aronne come avesse permesso al popolo un peccato così grave.", "Moses came down and saw the golden calf. He asked Aaron how he let the people commit such a sin."], ["מִי", "Chi è per Hashem, venga da me!", "Whoever is for Hashem, come to me!", "Un appello alla porta dell'accampamento, e una tribù risponde.", "A call at the camp's gate, and one tribe answers.", "Dopo il peccato del vitello, Mosè si mise alla porta del campo chiamando chi era fedele a Hashem. Accorsero tutti i Leviti.", "After the golden calf, Moses stood at the camp gate calling those loyal to Hashem. All the Levites gathered to him."], ["הַרְאֵנִי", "Fammi vedere la tua gloria", "Please show me Your glory", "Una richiesta molto audace: capire Hashem più a fondo.", "A very bold request: to understand Hashem more deeply.", "Dopo il vitello d'oro, Mosè chiese di conoscere meglio Hashem. Hashem disse che avrebbe fatto passare davanti a lui la sua bontà.", "After the golden calf, Moses asked to know Hashem more deeply. Hashem said He would pass His goodness before him."], ["לֹא", "Non potrai vedere il mio volto", "You cannot see My face", "La risposta alla richiesta di vedere la gloria.", "The answer to the request to see the glory.", "Hashem spiegò a Mosè che nessuno può vedere il suo volto e vivere, ma che lo avrebbe visto «di spalle».", "Hashem explained that no person can see His face and live, but Moses would see His “back”."], ["שֵׁשֶׁת", "Sei giorni si lavorerà, ma il settimo giorno sarà per voi santo", "Six days work shall be done, but the seventh day shall be holy to you", "Prima delle istruzioni per il Tabernacolo, un promemoria sul giorno di riposo.", "Before the building instructions, a reminder about the day of rest.", "Mosè radunò il popolo. Prima di spiegare come costruire il Tabernacolo ricordò che di Shabbat non si lavora, nemmeno per il Tabernacolo.", "Moses gathered the people. Before explaining how to build the Mishkan, he reminded them that on Shabbat no work is done, even for the Mishkan."], ["לֹא", "Non accenderete il fuoco in nessuna delle vostre dimore nel giorno di Shabbat", "You shall not kindle fire in any of your dwellings on the Shabbat day", "Un lavoro particolare è ricordato per il giorno di Shabbat.", "One special kind of work is mentioned for Shabbat.", "Mosè ricordò in particolare che di Shabbat non si accende il fuoco in nessun luogo dove si abita.", "Moses specifically reminded them not to kindle fire on Shabbat wherever they live."], ["רְאוּ", "Vedete: Hashem ha chiamato per nome Betzalel", "See, Hashem has called by name Bezalel", "Il grande artista che costruì il Tabernacolo.", "The great artist who built the Mishkan.", "Mosè annunciò che Hashem aveva scelto Betzalel figlio di Uri e gli aveva dato la saggezza per costruire il Tabernacolo.", "Moses announced that Hashem had chosen Bezalel son of Uri and given him wisdom to build the Mishkan."], ["מַרְבִּים", "Il popolo porta più del necessario", "The people are bringing much more than enough", "Un problema insolito: troppe donazioni!", "An unusual problem: too many donations!", "Il popolo portava doni ogni mattina. Gli artigiani dissero a Mosè che ce n'era più del necessario, e Mosè fece smettere.", "The people brought gifts every morning. The craftsmen told Moses there was more than enough, and Moses told them to stop."], ["בְּיוֹם", "Il primo giorno del primo mese erigerai il Tabernacolo", "On the first day of the first month you shall set up the Tabernacle", "Una data speciale: il primo di Nisan.", "A special date: the first of Nisan.", "Tutte le parti del Tabernacolo erano pronte. Hashem disse a Mosè di montarlo il primo di Nisan.", "All the parts of the Mishkan were ready. Hashem told Moses to set it up on the first of Nisan."], ["וְהִלְבַּשְׁתָּ", "Vestirai Aronne con le vesti sacre", "You shall clothe Aaron in the holy garments", "Abiti speciali per il Sommo Sacerdote.", "Special clothes for the High Priest.", "Hashem disse a Mosè di vestire Aronne con gli abiti sacri e di ungerlo sacerdote.", "Hashem told Moses to dress Aaron in the holy garments and anoint him as priest."], ["וּמָשַׁחְתָּ", "Li ungerai come hai unto il loro padre", "You shall anoint them as you anointed their father", "Anche i figli del Sommo Sacerdote vengono unti.", "The High Priest's sons are anointed too.", "Hashem ordinò di ungere anche i figli di Aronne, perché il sacerdozio passasse nella loro famiglia per tutte le generazioni.", "Hashem commanded that Aaron's sons be anointed too, so the priesthood would pass down in their family forever."], ["אָדָם", "Quando qualcuno di voi offrirà un sacrificio a Hashem", "When any person among you brings an offering to Hashem", "Una chiamata dalla Tenda del Convegno, all'inizio del terzo libro.", "A call from the Tent of Meeting, at the start of the third book.", "All'inizio del Levitico Hashem chiamò Mosè dalla Tenda del Convegno e gli insegnò le leggi dei sacrifici.", "At the start of Leviticus, Hashem called Moses from the Tent of Meeting and taught him the laws of offerings."], ["עַל", "Su ogni tua offerta metterai del sale", "With all your offerings you shall offer salt", "Un condimento che deve esserci in ogni sacrificio.", "One seasoning that must be on every offering.", "Hashem ordinò di mettere sale su ogni sacrificio. Ancora oggi molti intingono il pane nel sale all'inizio del pasto.", "Hashem commanded salt on every offering. To this day many dip their bread in salt at the start of a meal."], ["נֶפֶשׁ", "Se qualcuno pecca per errore", "If a person sins unintentionally", "Che cosa si fa quando si sbaglia senza volerlo?", "What do you do when you make a mistake without meaning to?", "Hashem insegnò a Mosè che cosa porta chi ha peccato per sbaglio, senza accorgersene: un sacrificio di espiazione.", "Hashem taught Moses what a person brings after sinning by mistake: a sin-offering."], ["אֵשׁ", "Un fuoco perenne arderà sull'altare: non si spegnerà", "A constant fire shall burn on the altar; it shall not go out", "Un fuoco che non si deve mai spegnere, né di giorno né di notte.", "A fire that must never go out, day or night.", "Hashem disse a Mosè di ordinare ad Aronne e ai figli che il fuoco sull'altare ardesse sempre senza spegnersi.", "Hashem told Moses to command Aaron and his sons that the altar fire must always burn and never go out."], ["זֶה", "Questo è ciò che Hashem ha ordinato di fare", "This is what Hashem has commanded to be done", "Tutta la comunità si è radunata all'ingresso della Tenda del Convegno.", "The whole congregation gathered at the entrance of the Tent of Meeting.", "Prima della consacrazione dei sacerdoti, Mosè radunò il popolo e spiegò che tutto avveniva per ordine di Hashem.", "Before consecrating the priests, Moses gathered everyone and explained that all would be done by Hashem's command."], ["בַּשְּׁלוּ", "Cuocete la carne all'ingresso della Tenda del Convegno", "Boil the meat at the entrance of the Tent of Meeting", "I sette giorni di consacrazione, e i sacerdoti non escono.", "The seven days of consecration, when the priests stay inside.", "Nei giorni di consacrazione, Mosè insegnò ad Aronne e ai figli a cuocere la carne del sacrificio e a mangiarla all'ingresso della Tenda.", "During the consecration days, Moses taught Aaron and his sons to cook the offering's meat and eat it at the Tent's entrance."], ["קְרַב", "Avvicinati all'altare e offri il tuo sacrificio", "Approach the altar and offer your sin-offering", "L'ottavo giorno, il Sommo Sacerdote esita ad avvicinarsi.", "On the eighth day, the High Priest hesitates to approach.", "Nel giorno dell'inaugurazione, Aronne esitò ad avvicinarsi all'altare. Mosè lo incoraggiò a offrire i sacrifici.", "On the day of the Mishkan's dedication, Aaron hesitated to approach the altar. Moses encouraged him to bring the offerings."], ["הוּא", "È ciò che Hashem disse: tra quelli vicini a me sarò santificato", "This is what Hashem spoke: Through those near to Me I will be sanctified", "Dopo la morte di due figli del Sommo Sacerdote, il padre tace.", "After two of the High Priest's sons die, their father is silent.", "Nadav e Avihu morirono offrendo un fuoco estraneo. Mosè consolò Aronne, e Aronne rimase in silenzio.", "Nadab and Abihu died bringing a strange fire. Moses comforted Aaron, and Aaron was silent."], ["יַיִן", "Non bere vino né bevande inebrianti, né tu né i tuoi figli", "Do not drink wine or strong drink, you or your sons with you", "Una rara volta in cui la parola va direttamente al Sommo Sacerdote.", "A rare time the words go straight to the High Priest.", "Hashem parlò direttamente ad Aronne: i sacerdoti non devono bere vino prima di entrare a servire nel Tabernacolo.", "Hashem spoke directly to Aaron: priests must not drink wine before entering the Mishkan to serve."], ["זֹאת", "Questi sono gli animali che potrete mangiare", "These are the creatures that you may eat", "I segni degli animali kasher: zoccolo spaccato e ruminazione.", "Signs of kosher animals: split hooves and chewing the cud.", "Hashem insegnò a Mosè e ad Aronne quali animali si possono mangiare e quali no: le leggi della kasherut.", "Hashem taught Moses and Aaron which animals may be eaten and which not: the laws of kashrut."], ["וּבַיּוֹם", "L'ottavo giorno sarà circonciso", "On the eighth day he shall be circumcised", "Un precetto per un neonato di otto giorni.", "A commandment for an eight-day-old baby.", "Hashem ripeté il precetto della circoncisione, già dato ad Abramo, nell'ottavo giorno.", "Hashem repeated the commandment of circumcision, given already to Abraham, on the eighth day."], ["וְהוּבָא", "Sarà condotto dal sacerdote Aronne o da uno dei suoi figli sacerdoti", "He shall be brought to Aaron the priest or to one of his sons the priests", "Chi ha una macchia sulla pelle non va dal medico ma dal sacerdote.", "Someone with a skin mark goes not to a doctor but to the priest.", "Hashem insegnò a Mosè e ad Aronne che chi aveva una macchia sulla pelle doveva mostrarla al sacerdote.", "Hashem taught Moses and Aaron that anyone with a skin mark must show it to the priest."], ["וְטָמֵא", "Griderà: «Impuro, impuro!»", "He shall call out: “Impure, impure!”", "Una parola ripetuta due volte, perché gli altri sappiano.", "A word repeated twice, so others will know.", "Chi era impuro per la tzaraat doveva gridare «impuro, impuro» perché gli altri non si avvicinassero.", "Someone impure with tzaraat had to call “impure, impure” so others would know not to come close."], ["זֹאת", "Questa sarà la legge del lebbroso nel giorno della sua purificazione", "This shall be the law of the leper on the day of his purification", "La strada per tornare all'accampamento, dopo la guarigione.", "The way back into the camp, after the mark is gone.", "Hashem insegnò a Mosè come purificare chi era stato colpito dalla tzaraat e come rientrava nell'accampamento.", "Hashem taught Moses how to purify someone who had tzaraat and how they return to live in the camp."], ["כִּי", "Quando entrerete nella terra di Canaan che io vi do in possesso", "When you come into the land of Canaan which I give you as a possession", "Una legge che varrà solo quando avranno case nella Terra.", "A law that will apply only once they have houses in the Land.", "Hashem insegnò a Mosè e ad Aronne le macchie che potevano apparire sui muri delle case, dopo l'ingresso nella Terra.", "Hashem taught Moses and Aaron about marks that could appear on house walls after entering the Land."], ["כְּנֶגַע", "Mi sembra di aver visto come una macchia nella casa", "Something like a plague has appeared to me in the house", "Qualcuno ha visto una strana macchia sul muro di casa.", "Someone saw a strange stain on the wall of their house.", "Chi vedeva una macchia sul muro di casa doveva andare a dirlo al sacerdote, che veniva a controllare.", "Anyone who saw a mark on their house wall had to go and tell the priest, who would come to check."], ["דַּבֵּר", "Di' ad Aronne tuo fratello che non entri in ogni momento nel santuario", "Tell Aaron your brother not to come at all times into the Holy", "Un luogo così santo che vi si entra una sola volta l'anno.", "A place so holy it's entered only once a year.", "Dopo la morte dei due figli di Aronne, Hashem disse che Aronne poteva entrare nel Santo dei Santi solo a Yom Kippur.", "After Aaron's two sons died, Hashem said Aaron could enter the Holy of Holies only on Yom Kippur."], ["כִּי", "In questo giorno si farà espiazione per voi, per purificarvi", "For on this day atonement shall be made for you, to purify you", "Il giorno più santo dell'anno, il dieci di Tishri.", "The holiest day of the year, the tenth of Tishrei.", "Hashem istituì Yom Kippur, il giorno in cui perdona il popolo e lo purifica.", "Hashem commanded Yom Kippur, the day He forgives the people and purifies them."], ["וּשְׁמַרְתֶּם", "Osserverete i miei statuti e le mie leggi: chi li mette in pratica vivrà per essi", "Keep My statutes and My laws, which a person shall do and live by them", "I precetti sono un modo di vivere, non un motivo per morire.", "The commandments are a way to live, not a reason to die.", "Hashem disse che i precetti esistono perché l'uomo viva per essi. Da qui si impara che si salva una vita anche di Shabbat.", "Hashem said the commandments are for living by. From here we learn to save a life even on Shabbat."], ["קְדֹשִׁים", "Siate santi, perché io, Hashem vostro Dio, sono santo", "You shall be holy, for I, Hashem your God, am holy", "Due parole che hanno dato il nome alla parashà.", "Two words that gave the parasha its name.", "Hashem disse a Mosè di parlare a tutta la comunità e chiedere di essere santi, come Hashem è santo.", "Hashem told Moses to speak to the whole congregation and ask them to be holy, as Hashem is holy."], ["לֹא", "Non maledirai il sordo e non metterai inciampo davanti al cieco", "Do not curse the deaf, and do not put a stumbling block before the blind", "Non approfittare di chi non sente o non vede.", "Don't take advantage of someone who can't hear or see.", "Hashem ordinò di non maledire chi non sente e di non mettere ostacoli davanti a chi non vede, anche con un cattivo consiglio.", "Hashem commanded not to curse those who can't hear, nor trip up those who can't see, even with bad advice."], ["וְאָהַבְתָּ", "Amerai il tuo prossimo come te stesso", "Love your neighbor as yourself", "Rabbi Akiva disse che questo è un grande principio della Torah.", "Rabbi Akiva said this is a great principle of the Torah.", "Hashem ordinò di amare ogni persona come se stessi. Rabbi Akiva lo chiamò un grande principio della Torah.", "Hashem commanded us to love everyone as ourselves. Rabbi Akiva called it a great principle of the Torah."], ["מִפְּנֵי", "Alzati davanti ai capelli bianchi e onora il volto dell'anziano", "Rise before the aged, and honor the face of the elder", "Che cosa si fa quando entra nella stanza una persona anziana?", "What do you do when an elderly person enters the room?", "Hashem ordinò di onorare gli anziani e di alzarsi in piedi davanti a loro.", "Hashem commanded us to honor elderly people and stand up for them."], ["אֱמֹר", "Parla ai sacerdoti, figli di Aronne", "Speak to the priests, the sons of Aaron", "La prima parola della parashà le ha dato il nome.", "The first word of the parasha gave it its name.", "Hashem disse a Mosè di parlare ai sacerdoti e spiegare le loro regole speciali.", "Hashem told Moses to speak to the priests and explain their special laws."], ["וּלְקַחְתֶּם", "Il primo giorno prenderete il frutto di un albero splendido e rami di palma", "On the first day take the fruit of a beautiful tree and branches of palm", "Le quattro specie della festa di Sukkot.", "The four species of the Sukkot festival.", "Hashem ordinò di prendere a Sukkot cedro, palma, mirto e salice e di gioire davanti a Lui.", "Hashem commanded taking the etrog, lulav, myrtle and willow on Sukkot and rejoicing before Him."], ["עַיִן", "Occhio per occhio, dente per dente", "Eye for eye, tooth for tooth", "I Saggi spiegarono che si tratta di un risarcimento in denaro.", "The Sages explained it means paying money for damage.", "Hashem insegnò la legge su chi causa un danno. I Saggi spiegarono che si intende un risarcimento in denaro.", "Hashem taught the law of injury. The Sages explained it means paying money according to the damage."], ["וְשָׁבְתָה", "La terra osserverà un sabato per Hashem", "The land shall rest a Shabbat for Hashem", "Anche la terra ha bisogno di riposo, ogni sette anni.", "The land needs rest too, once every seven years.", "Sul Sinai Hashem istituì l'anno sabbatico: il settimo anno non si semina e non si miete.", "At Sinai Hashem commanded the Shemitah year: in the seventh year we neither sow nor reap."], ["וּקְרָאתֶם", "Proclamerete la libertà nella terra per tutti i suoi abitanti", "Proclaim liberty throughout the land to all its inhabitants", "Ogni cinquant'anni si suona lo shofar e gli schiavi tornano liberi.", "Every fifty years the shofar sounds and slaves go free.", "Hashem istituì il Giubileo: nel cinquantesimo anno gli schiavi venivano liberati e i campi tornavano ai proprietari.", "Hashem commanded the Jubilee: in the fiftieth year all slaves go free and fields return to their owners."], ["כִּי", "Perché la terra è mia", "For the land is Mine", "Perché non si può vendere un campo per sempre?", "Why can't a field be sold forever?", "Hashem spiegò che la terra non si vende per sempre, perché appartiene a Lui e gli uomini sono come ospiti.", "Hashem explained land may not be sold forever, for it belongs to Him and people are like guests."], ["וְנָתַתִּי", "Vi darò le piogge a loro tempo", "I will give your rains in their season", "Una benedizione che scende dal cielo al momento giusto.", "A blessing that comes from the sky at the right time.", "Hashem promise che, se seguiranno le sue vie, la pioggia scenderà al momento giusto e la terra darà frutto.", "Hashem promised that if they follow His ways, rain will fall on time and the land will give its produce."], ["וְנָתַתִּי", "Darò pace nella terra", "I will give peace in the land", "La benedizione più importante di tutte.", "The most important blessing of all.", "Tra le benedizioni, Hashem promise la pace, perché nessuno abbia paura e tutti dormano tranquilli.", "Among the blessings, Hashem promised peace, so no one would be afraid and all could sleep safely."], ["וְהִתְהַלַּכְתִּי", "Camminerò in mezzo a voi e sarò il vostro Dio", "I will walk among you and be your God", "Una promessa di vicinanza speciale tra Hashem e il popolo.", "A promise of a special closeness between Hashem and the people.", "Hashem promise che, se osserveranno i precetti, camminerà quasi in mezzo a loro e sarà loro vicino.", "Hashem promised that if they keep His commandments, He will walk among them and be close to them."], ["שְׂאוּ", "Fate il censimento di tutta la comunità dei figli d'Israele", "Take a census of the whole congregation of the Children of Israel", "Un grande censimento nel deserto del Sinai.", "A great census in the Sinai desert.", "All'inizio dei Numeri, Hashem ordinò di contare i figli d'Israele, famiglia per famiglia e tribù per tribù.", "At the start of Numbers, Hashem commanded counting the Israelites, family by family and tribe by tribe."], ["אַךְ", "Ma non censirai la tribù di Levi", "But do not count the tribe of Levi", "Una tribù non viene contata con le altre.", "One tribe is not counted with the rest.", "Hashem disse di non contare la tribù di Levi con le altre, perché il suo compito era custodire il Tabernacolo.", "Hashem said not to count Levi with the other tribes, since its job was to guard the Mishkan."], ["אִישׁ", "Ciascuno si accamperà presso la propria bandiera", "Each man by his own banner shall they encamp", "Ogni tribù ha la sua bandiera e un posto fisso intorno al Tabernacolo.", "Each tribe has its own flag and a set place around the Mishkan.", "Hashem organizzò l'accampamento: ogni tribù sotto la propria bandiera, in un lato fisso intorno al Tabernacolo.", "Hashem arranged the camp: each tribe under its own banner, on a fixed side around the Mishkan."], ["וְהִתְוַדּוּ", "Confesseranno il peccato che hanno commesso", "They shall confess the sin that they have done", "Il primo passo della teshuvà: ammettere ciò che si è fatto.", "The fi
